name: Deploy to Aliyun (.cn)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SITE: cn
  NODE_VERSION: "22"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # R3 修复：构建期使用 GitHub Actions 内置临时 PostgreSQL service。
    # 仅在本 job 的 runner（ubuntu-latest）上有效；构建期连接串与运行期
    # （ECS 主机 /opt/cn/.env.cn 的 DATABASE_URL_CN，host=cn-postgres）完全分离。
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 构建期数据库 URL（仅 CI 构建使用，指向上面 postgres service）：
      # - CI_DATABASE_URL：runner 步骤（prisma generate / next build）用 localhost
      # - CI_DATABASE_URL_DOCKER：docker build 的 builder 阶段用 host.docker.internal
      #   （build 容器内 localhost 指容器自身，需经 host-gateway 到达 runner 上发布的
      #    service 端口；配合下方 --add-host=host.docker.internal:host-gateway）
      CI_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      CI_DATABASE_URL_DOCKER: postgresql://postgres:postgres@host.docker.internal:5432/postgres?schema=public
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        # 2026-09-02：由 npm ci 改为 npm install。
        # 原因：仓库 package-lock.json 是在 Windows 上生成的，@emnapi/core / @emnapi/runtime
        # 仅以 wasm32-wasi 的嵌套依赖存在（1.10.0），根级无提升条目；CI 为 ubuntu-latest，
        # npm ci 重新解析后要求根级 @emnapi/core@1.11.3，而该版本不在 lock 内，
        # 直接报 EUSAGE "Missing: @emnapi/core@1.11.3 from lock file"（run #107 / #108 连续失败）。
        # npm install 允许就地补齐平台差异依赖，先恢复 .cn 部署通道；
        # 待 lock 在 Linux 环境下重新生成后再改回 npm ci。
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Init build database schema
        # R4 修复：构建期临时 postgres service 只有空库无表，ISR 预渲染真实连库查询
        # （如 miniapp/brands-categories 的 prisma.category.findMany）会因
        # "table does not exist"（P2021）失败。用 prisma db push 按仓库 schema 建好
        # 全部表结构（空表无数据），与 R1 部署期做法一致；--skip-generate 不再重复生成
        # client（上一步已生成）。migrations 仅 2 个增量、依赖历史基础表，空库必须 db push。
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}

      - name: Build Next.js (standalone, SITE=cn)
        run: npm run build
        env:
          SITE: cn
          # db.ts 在 SITE=cn 时读 DATABASE_URL_CN（next build ISR 预渲染会真实连库）；
          # schema.prisma 的 datasource 读 DATABASE_URL（prisma generate 需变量存在）。
          # 两者都指向构建期临时 postgres service，不再使用 secrets.DATABASE_URL_CN
          # （其指向 ECS 内网 cn-postgres，GitHub Actions 不可达）。
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          DATABASE_URL_CN: ${{ env.CI_DATABASE_URL }}
          NEXT_PUBLIC_SITE: cn
          NEXT_PUBLIC_APP_URL: https://usedfarmmach.cn

      - name: Build Docker image
        run: |
          # docker build 的 builder 阶段容器内 localhost 指容器自身，
          # 故用 host.docker.internal + host-gateway 到达 runner 上发布的 service 端口。
          # 2026-09-03：移除 --no-cache，允许 Docker 复用层缓存。
          # 注意：GitHub Actions 的 ubuntu-latest runner 每次都是全新 VM，本地 Docker
          # 层缓存默认不跨 run 保留 —— 故在未接入 cache-from/cache-to 之前，此项
          # 收益接近于 0。移除它是为后续接入 GHA/registry 层缓存铺路，且语义上
          # 本就不该强制禁用缓存（Dockerfile.cn 已做 base/deps/builder/runner 分层）。
          # ⚠️ 若要真正让缓存生效，需改用 docker/build-push-action + cache-from/cache-to
          #    type=gha（或 type=registry），并单独验证 buildx 下 host.docker.internal
          #    能否解析到 runner 上发布的临时 postgres —— 否则 next build 的 ISR
          #    预渲染会连不上库而失败。此项留作后续独立变更。
          docker build \
            --add-host=host.docker.internal:host-gateway \
            --build-arg SITE=cn \
            --build-arg DATABASE_URL=${{ env.CI_DATABASE_URL }} \
            --build-arg DATABASE_URL_CN=${{ env.CI_DATABASE_URL_DOCKER }} \
            -t usedfarmmach-cn:latest \
            -f Dockerfile.cn .

      - name: Install ossutil (Aliyun OSS CLI)
        run: |
          # 阿里云官方 ossutil 1.7.19（Linux x86_64），解压后二进制名为 ossutil
          curl -fSL --retry 3 -o /tmp/ossutil.zip \
            https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip
          rm -rf /tmp/ossutil-x && mkdir -p /tmp/ossutil-x
          unzip -o /tmp/ossutil.zip -d /tmp/ossutil-x
          BIN="$(find /tmp/ossutil-x -maxdepth 2 -type f \( -name 'ossutil' -o -name 'ossutil64' \) | head -1)"
          if [ -z "$BIN" ]; then
            echo "ERROR: ossutil 解压产物中未找到可执行文件" >&2
            exit 1
          fi
          sudo install -m 0755 "$BIN" /usr/local/bin/ossutil
          ossutil --version

      - name: Save and compress Docker image
        run: |
          set -euo pipefail
          # 镜像 tag 与 OSS 对象名均以完整 commit SHA 命名（cn-app-<sha>.tar.gz）
          docker tag usedfarmmach-cn:latest "usedfarmmach-cn:${{ github.sha }}"
          mkdir -p /tmp/cn-images
          # 2026-09-03：gzip -9 → gzip -1。镜像 tarball 仅经 OSS 在公网传输，
          # 压缩级别对最终下载体积影响极小（Docker 层本身已去重/压缩），但 -9 比 -1
          # 多耗 1~2 分钟 CPU。改为 -1 在不增加传输量的前提下显著缩短打包耗时。
          docker save "usedfarmmach-cn:${{ github.sha }}" | gzip -1 > "/tmp/cn-images/cn-app-${{ github.sha }}.tar.gz"
          ls -lh /tmp/cn-images/

      - name: Upload image tarball to Aliyun OSS
        run: |
          # 复用现有 bucket usedfarmmach-oss（北京，与 ECS 同地域）
          ossutil cp -f "/tmp/cn-images/cn-app-${{ github.sha }}.tar.gz" \
            "oss://usedfarmmach-oss/cn-images/cn-app-${{ github.sha }}.tar.gz" \
            -e oss-cn-beijing.aliyuncs.com \
            -i "${{ secrets.OSS_ACCESS_KEY_ID }}" \
            -k "${{ secrets.OSS_ACCESS_KEY_SECRET }}"

      # ----------------------------------------------------------
      # 部署到阿里云 ECS（北京）
      # 通过 SSH 以 deploy 用户登入 ECS，由主机执行 deploy/deploy-cn.sh。
      # 安全红线：运行时 secrets（DATABASE_URL_CN / JWT_SECRET / OSS_* / WECHAT_PAY_*）
      # 一律由 ECS 主机 /opt/cn/.env.cn 提供，CI 绝不注入（避免进入 CI 日志）。
      # 镜像包已上传 OSS（cn-images/cn-app-<sha>.tar.gz），脚本内从 OSS 下载 + docker load；
      # OSS 对象名以完整 commit SHA 命名，与上方上传一致。
      # ----------------------------------------------------------
      # 部署前先把仓库最新的 deploy/deploy-cn.sh 同步到 ECS，
      # 避免 ECS 本地旧脚本（缺少 R4/#37/#38 等修复）导致部署失败。
      - name: Sync deploy script to ECS
        uses: appleboy/scp-action@v1
        with:
          host: 101.200.125.199
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/deploy-cn.sh"
          target: "/opt/cn"

      # R47 教训：docker-compose.yml 之前没 sync 到 ECS，PR #47 改的 healthcheck
      # 在 ECS 上根本看不见，cn-app 一直用旧 compose 配置。下面补上同步步骤。
      - name: Sync docker-compose.yml to ECS
        uses: appleboy/scp-action@v1
        with:
          host: 101.200.125.199
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/cn"

      - name: Deploy to Aliyun ECS
        uses: appleboy/ssh-action@v1
        with:
          host: 101.200.125.199
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            # 与上传阶段一致的 commit SHA：脚本据此推导对象名 cn-app-<sha>.tar.gz 与镜像 tag
            export CN_IMAGE_REF="${{ github.sha }}"
            cd /opt/cn
            bash /opt/cn/deploy/deploy-cn.sh
