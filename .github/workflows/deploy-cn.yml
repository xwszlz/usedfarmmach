name: Deploy to Aliyun (.cn)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SITE: cn
  NODE_VERSION: "22"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CN }}

      - name: Build Next.js (standalone, SITE=cn)
        run: npm run build
        env:
          SITE: cn
          DATABASE_URL: ${{ secrets.DATABASE_URL_CN }}
          NEXT_PUBLIC_SITE: cn
          NEXT_PUBLIC_APP_URL: https://usedfarmmach.cn

      - name: Build Docker image
        run: |
          docker build \
            --build-arg SITE=cn \
            -t usedfarmmach-cn:latest \
            -f Dockerfile.cn .

      - name: Login to Aliyun Container Registry
        uses: aliyun/acr-login@v1
        with:
          login-server: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Tag and push Docker image
        run: |
          IMAGE_TAG="${{ secrets.ALIYUN_ACR_REGISTRY }}/usedfarmmach-cn:${GITHUB_SHA::8}"
          docker tag usedfarmmach-cn:latest "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # ----------------------------------------------------------
      # 部署到阿里云 ECS（北京）
      # 通过 SSH 以 deploy 用户登入 ECS，由主机执行 deploy/deploy-cn.sh。
      # 安全红线：运行时 secrets（DATABASE_URL_CN / JWT_SECRET / OSS_* / WECHAT_PAY_*）
      # 一律由 ECS 主机 /opt/cn/.env.cn 提供，CI 绝不注入（避免进入 CI 日志）。
      # 镜像由上方 ACR 步骤 build + push，标签写入 env.IMAGE_TAG。
      # 阿里云 ACR 若尚未开通：保留下方 ssh-action 结构，但 build/push 段需改为
      # 其它镜像仓库（如 Docker Hub / 阿里云 ACR 开通后填 ALIYUN_ACR_* secrets），
      # 并确保 ECS 主机已 docker login 到对应私有仓库。
      # ----------------------------------------------------------
      - name: Deploy to Aliyun ECS
        uses: appleboy/ssh-action@v1
        with:
          host: 101.200.125.199
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            # 镜像标签与 build 阶段推送的完全一致（env.IMAGE_TAG 即上方 push 的引用）
            export CN_IMAGE="${{ env.IMAGE_TAG }}"
            cd /opt/cn
            bash /opt/cn/deploy/deploy-cn.sh
