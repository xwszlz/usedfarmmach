name: Deploy to Aliyun (.cn)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SITE: cn
  NODE_VERSION: "22"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CN }}

      - name: Build Next.js (standalone, SITE=cn)
        run: npm run build
        env:
          SITE: cn
          DATABASE_URL: ${{ secrets.DATABASE_URL_CN }}
          NEXT_PUBLIC_SITE: cn
          NEXT_PUBLIC_APP_URL: ${{ secrets.CN_APP_URL }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg SITE=cn \
            -t usedfarmmach-cn:latest \
            -f Dockerfile.cn .

      - name: Login to Aliyun Container Registry
        uses: aliyun/acr-login@v1
        with:
          login-server: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Tag and push Docker image
        run: |
          IMAGE_TAG="${{ secrets.ALIYUN_ACR_REGISTRY }}/usedfarmmach-cn:${GITHUB_SHA::8}"
          docker tag usedfarmmach-cn:latest "$IMAGE_TAG"
          docker push "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to Aliyun ECS
        env:
          ALIYUN_ACCESS_KEY: ${{ secrets.ALIYUN_ACCESS_KEY }}
          ALIYUN_SECRET_KEY: ${{ secrets.ALIYUN_SECRET_KEY }}
          ALIYUN_REGION: ${{ secrets.ALIYUN_REGION || 'cn-beijing' }}
          ALIYUN_ECS_INSTANCE_ID: ${{ secrets.ALIYUN_ECS_INSTANCE_ID }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          # 通过 SSH 部署到 ECS（需要提前配置部署密钥）
          # 此处使用阿里云 CLI + ECS 运维助手，或自行替换为 SSH 部署脚本
          echo "Deploying $IMAGE_TAG to ECS instance $ALIYUN_ECS_INSTANCE_ID..."
          # 示例：通过 SSH 拉取镜像并重启容器
          # ssh deploy@your-ecs-ip "
          #   docker pull $IMAGE_TAG &&
          #   docker stop usedfarmmach-cn || true &&
          #   docker rm usedfarmmach-cn || true &&
          #   docker run -d --name usedfarmmach-cn \
          #     -p 3000:3000 \
          #     -e DATABASE_URL=${{ secrets.DATABASE_URL_CN }} \
          #     -e SITE=cn \
          #     -e NEXT_PUBLIC_SITE=cn \
          #     -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
          #     -e OSS_REGION=${{ secrets.OSS_REGION }} \
          #     -e OSS_ACCESS_KEY_ID=${{ secrets.OSS_ACCESS_KEY_ID }} \
          #     -e OSS_ACCESS_KEY_SECRET=${{ secrets.OSS_ACCESS_KEY_SECRET }} \
          #     -e OSS_BUCKET=${{ secrets.OSS_BUCKET }} \
          #     -e OSS_ENDPOINT=${{ secrets.OSS_ENDPOINT }} \
