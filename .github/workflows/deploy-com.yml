name: Deploy to Vercel (.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SITE: com
  VERCEL_ORG_ID: team_0mLLhAKmKhy0lXQMIhX1w1BE
  VERCEL_PROJECT_ID: prj_BQYAPRqXERYn9cCXHEYRXRtBxxOD

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Step 1: 注入环境变量到 Vercel（通过 REST API）
      - name: Inject env vars into Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
        run: |
          set -e
          api_base="https://api.vercel.com/v10/projects/${PROJECT_ID}/env"

          upsert_env() {
            local key="$1" value="$2"
            existing=$(curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "${api_base}?decrypt=true" | \
              python3 -c "
              import sys,json
              data=json.load(sys.stdin)
              for e in data.get('envs',[]):
                if e.get('key')=='$key':
                  print(e['id'])
                  break
            " 2>/dev/null || echo "")

            if [ -n "$existing" ]; then
              curl -sS -X PATCH "${api_base}/${existing}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"value\":\"${value}\",\"target\":[\"production\",\"preview\",\"development\"]}"
              echo "  ✅ Updated $key (id: $existing)"
            else
              curl -sS -X POST "${api_base}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"key\":\"${key}\",\"value\":\"${value}\",\"target\":[\"production\",\"preview\",\"development\"]}"
              echo "  ✅ Created $key"
            fi
          }

          echo "📦 Injecting environment variables for SITE=com..."
          upsert_env "SITE" "com"
          upsert_env "NEXT_PUBLIC_SITE" "com"
          upsert_env "SITE_DOMAIN" "usedfarmmach.com"
          echo "🎉 All environment vars injected!"

      # Step 2: 部署到 Vercel（SITE=com）
      - name: Deploy to Vercel
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
          SITE: com
