name: Deploy to Vercel (.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SITE: com
  VERCEL_ORG_ID: team_0mLLhAKmKhy0lXQMIhX1w1BE
  VERCEL_PROJECT_ID: prj_BQYAPRqXERYn9cCXHEYRXRtBxxOD

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Step 1: 注入环境变量到 Vercel（通过 REST API）
      - name: Inject env vars into Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
        run: |
          set -e
          api_base="https://api.vercel.com/v10/projects/${PROJECT_ID}/env"

          upsert_env() {
            local key="$1" value="$2"
            existing=$(curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "${api_base}?decrypt=true" | \
              python3 -c "
              import sys,json
              data=json.load(sys.stdin)
              for e in data.get('envs',[]):
                if e.get('key')=='$key':
                  print(e['id'])
                  break
            " 2>/dev/null || echo "")

            if [ -n "$existing" ]; then
              curl -sS -X PATCH "${api_base}/${existing}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"value\":\"${value}\",\"target\":[\"production\",\"preview\",\"development\"]}"
              echo "  ✅ Updated $key (id: $existing)"
            else
              curl -sS -X POST "${api_base}" \
                -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "{\"key\":\"${key}\",\"value\":\"${value}\",\"target\":[\"production\",\"preview\",\"development\"]}"
              echo "  ✅ Created $key"
            fi
          }

          echo "📦 Injecting environment variables for SITE=com..."
          upsert_env "SITE" "com"
          upsert_env "NEXT_PUBLIC_SITE" "com"
          upsert_env "SITE_DOMAIN" "usedfarmmach.com"
          echo "🎉 All environment vars injected!"

      # Step 2: 部署到 Vercel（SITE=com）
      - name: Deploy to Vercel
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
          SITE: com

      # Step 3: 安装依赖（含 @prisma/client 与 prisma CLI），
      # 供后续 prisma 命令与导入脚本使用。之前 .com 流程只装 vercel CLI、未跑 npm ci。
      - name: Install dependencies
        # 2026-09-02：由 npm ci 改为 npm install。
        # 原因同 deploy-cn.yml：仓库 package-lock.json 在 Windows 上生成，
        # @emnapi/core / @emnapi/runtime 只作为 @unrs/resolver-binding-wasm32-wasi 的
        # 嵌套依赖存在，Linux runner 上 npm ci 要求根级 @emnapi/core@1.11.3 而 lock 内没有，
        # 直接 EUSAGE 中止（本工作流 run #105 在此步失败）。
        run: npm install --no-audit --no-fund

      # Step 4: 生成 Prisma Client（按仓库 schema.prisma，
      # binaryTargets 含 "native"，覆盖 ubuntu-latest runner，无需改 schema）
      - name: Generate Prisma Client
        run: npx prisma generate

      # Step 5: 在 Neon 上建/同步 MarketIntel 表（幂等）。
      # 首次运行会在 Neon 新建全部表结构；--skip-generate 避免重复生成 client；
      # --accept-data-loss 与 .cn 侧风格一致（空库/小表推送安全）。
      - name: Push schema to Neon
        run: npx prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

      # Step 6: 将市场情报 JSON 导入 Neon（幂等：按日期 deleteMany + create，
      # 重复部署不重复累积）。复用 .cn 导入脚本，仅设置 DATABASE_URL=Neon
      # （脚本逻辑 DATABASE_URL || DATABASE_URL_CN，本步骤不设置 DATABASE_URL_CN）。
      - name: Import market intelligence into Neon
        run: node scripts/import-intelligence-to-cn.js
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
