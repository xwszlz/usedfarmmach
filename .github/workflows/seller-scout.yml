# #1 卖方采集 Agent — 每日定时采集工作流
# 触发：每天 06:00 UTC+8 (前一天 22:00 UTC)
# 行为：运行 Python 采集脚本 → 导入到 Neon DB（容错模式）

name: Seller Scout Daily

on:
  schedule:
    # 每天 UTC 22:00 = 北京时间 06:00
    - cron: "0 22 * * *"
  workflow_dispatch: # 支持手动触发

jobs:
  scrape-and-import:
    runs-on: ubuntu-latest
    # ⚠️ DATABASE_URL 必须在 job 级声明：step 自己的 env 对它自己的 `if` 不可见
    # （step 级 env 参与该 step 的环境构建发生在 `if` 判定之后），写在 step 级会让
    # `if: env.DATABASE_URL != ''` 恒为 false —— 实测 2026-08-13~09-01 共 7 次成功
    # run，两个 import 步骤 100% skipped、产出从未入库。
    # 另：仓库 secrets 里并没有 DATABASE_URL，正确名字是 NEON_DATABASE_URL。
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Python dependencies
        # 两个采集脚本都 `import requests`，此前只装了 urllib3
        # → ModuleNotFoundError 被 continue-on-error 吞掉，job 报 success 但采集条数恒为 0
        run: pip install urllib3 requests

      - name: Install Node dependencies
        # 2026-09-02 起 package-lock.json 与 package.json 不同步（缺
        # @emnapi/core@1.11.3、@emnapi/runtime@1.11.3），npm ci 会以 EUSAGE
        # 直接失败 → 本工作流自 2026-09-02 起每日停摆。deploy-cn.yml /
        # deploy-com.yml 已于同日改为 npm install，此处补齐。
        # 待 lock 在 Linux 环境下重新生成后可改回 npm ci。
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Agriaffaires scraper
        id: scrape
        continue-on-error: true
        run: python scripts/scrape_agriaffaires.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Run domestic seller scraper
        id: scrape_domestic
        continue-on-error: true
        run: python ../scripts/seller_scout_domestic_scraper.py
        working-directory: ./scripts
        env:
          PYTHONIOENCODING: utf-8
          HTTPS_PROXY: ""

      - name: Check scrape results
        id: check
        run: |
          TOTAL=0
          if [ -f scripts/agriaffaires_data.json ]; then
            COUNT=$(python3 -c "import json; d=json.load(open('scripts/agriaffaires_data.json')); print(d.get('totalListings', 0))")
            TOTAL=$((TOTAL + COUNT))
            echo "✅ 国际采集: $COUNT 条"
          else
            echo "⚠️ 国际采集文件不存在"
            echo '{"scrapedAt":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","source":"agriaffaires","totalListings":0,"withPrice":0,"priceOnRequest":0,"listings":[]}' > scripts/agriaffaires_data.json
          fi
          if [ -f scripts/domestic_sellers_data_v2.json ]; then
            DCOUNT=$(python3 -c "import json; d=json.load(open('scripts/domestic_sellers_data_v2.json')); print(d.get('totalListings', 0))")
            TOTAL=$((TOTAL + DCOUNT))
            echo "✅ 国内采集: $DCOUNT 条"
          else
            echo "⚠️ 国内采集文件不存在"
          fi
          echo "listing_count=$TOTAL" >> $GITHUB_OUTPUT
          echo "📊 总计: $TOTAL 条"

      # 国际数据 = Agriaffaires 等**境外公开行情**，写入 Neon（境外库）合规。
      # 注意：不要在这里再写 step 级 env: DATABASE_URL，会覆盖掉 job 级、并让 if 失效。
      - name: Import international data to database
        id: import
        if: env.DATABASE_URL != ''
        continue-on-error: true
        run: npx tsx scripts/import-seller-scout.ts

      # 🔴 国内导入**按合规要求停用**，不要打开。
      # scripts/import-seller-scout-domestic.ts 会把国内卖方数据（含个人联系信息）
      # 写入 Neon（境外库），撞「中国用户个人数据不得出境」红线。
      # 国内采集的正路是 ECS 上的采集器直写 cn-postgres。
      # 脚本保留在仓库中供 ECS 侧复用，本工作流不再调用。
      - name: Domestic import intentionally disabled (compliance)
        run: echo "⏭️ 国内导入已按合规要求停用：国内数据由 ECS 采集器写入 cn-postgres，不入 Neon"

      - name: Skip import (no DATABASE_URL)
        if: env.DATABASE_URL == ''
        run: echo "⚠️ NEON_DATABASE_URL secret 未配置，跳过数据库导入"

      - name: Upload scrape data as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agriaffaires-data-${{ github.run_number }}
          path: scripts/agriaffaires_data.json
          retention-days: 30

      - name: Report status
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Seller Scout Daily 报告"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "采集条数: ${{ steps.check.outputs.listing_count || 0 }}"
          echo "采集状态: ${{ steps.scrape.outcome }}"
          echo "导入状态: ${{ steps.import.outcome || 'skipped' }}"
          echo "时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
