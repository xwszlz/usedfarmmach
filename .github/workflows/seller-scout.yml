# #1 卖方采集 Agent — 每日定时采集工作流
# 触发：每天 06:00 UTC+8 (前一天 22:00 UTC)
# 行为：运行多源采集脚本 → 导入到 Neon DB（容错模式）→ 0 条即判失败（防假绿）
#
# 数据源：
#   - agroline.cn   中文站 拖拉机/打捆机（服务端渲染，纯 HTTP 可抓，无需代理）
#   - mascus.co.uk  英国站 拖拉机（服务端渲染，纯 HTTP 可抓，无需代理）
#   - 搜索 API      引擎索引里已有的带价挂牌（env-gated：无 SEARCH_API_KEY 时优雅跳过）
#   ※ Agriaffaires 已上 DataDome 商业反爬（首页/sitemap/详情页全 403），本工作流不再依赖它。

name: Seller Scout Daily

on:
  schedule:
    # 每天 UTC 22:00 = 北京时间 06:00
    - cron: "0 22 * * *"
  workflow_dispatch: # 支持手动触发

jobs:
  scrape-and-import:
    runs-on: ubuntu-latest
    # ⚠️ DATABASE_URL 必须在 job 级声明：step 自己的 env 对它自己的 `if` 不可见
    # （step 级 env 参与该 step 的环境构建发生在 `if` 判定之后），写在 step 级会让
    # `if: env.DATABASE_URL != ''` 恒为 false —— 实测 2026-08-13~09-01 共 7 次成功
    # run，两个 import 步骤 100% skipped、产出从未入库。
    # 另：仓库 secrets 里并没有 DATABASE_URL，正确名字是 NEON_DATABASE_URL。
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Python dependencies
        # 采集脚本均 `import requests`，此前只装了 urllib3
        # → ModuleNotFoundError 被 continue-on-error 吞掉，job 报 success 但采集条数恒为 0
        run: pip install urllib3 requests

      - name: Install Node dependencies
        # 2026-09-02 起 package-lock.json 与 package.json 不同步（缺
        # @emnapi/core@1.11.3、@emnapi/runtime@1.11.3），npm ci 会以 EUSAGE
        # 直接失败 → 本工作流自 2026-09-02 起每日停摆。deploy-cn.yml /
        # deploy-com.yml 已于同日改为 npm install，此处补齐。
        # 待 lock 在 Linux 环境下重新生成后可改回 npm ci。
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      # ── 替代源 1：agroline.cn（中文站，拖拉机/打捆机）──
      - name: Run agroline scraper
        id: scrape_agroline
        continue-on-error: true
        run: python scripts/scrape_agroline.py
        env:
          PYTHONIOENCODING: utf-8
          HTTPS_PROXY: "" # 强制直连（脚本支持 HTTPS_PROXY，可选）

      # ── 替代源 2：mascus.co.uk（英国站拖拉机）──
      - name: Run mascus scraper
        id: scrape_mascus
        continue-on-error: true
        run: python scripts/scrape_mascus.py
        env:
          PYTHONIOENCODING: utf-8
          HTTPS_PROXY: "" # 强制直连

      # ── 替代源 3：搜索 API 路线（无 SEARCH_API_KEY 时优雅跳过，退出码 0）──
      - name: Run search API route
        id: scrape_search_api
        continue-on-error: true
        run: npx tsx scripts/scout-via-search-api.ts
        env:
          # SEARCH_API_PROVIDER 故意不设：脚本按 key 前缀自动识别（tvly- → tavily）
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_MODEL_ID: ${{ secrets.ARK_MODEL_ID }}

      - name: Run domestic seller scraper
        id: scrape_domestic
        continue-on-error: true
        run: python ../scripts/seller_scout_domestic_scraper.py
        working-directory: ./scripts
        env:
          PYTHONIOENCODING: utf-8
          HTTPS_PROXY: ""

      - name: Check scrape results
        id: check
        run: |
          TOTAL=0
          INTL=0
          AGROLINE=0
          MASCUS=0
          SEARCH_API=0
          for SRC in agriaffaires agroline mascus search_api; do
            FILE="scripts/${SRC}_data.json"
            if [ ! -f "$FILE" ]; then
              echo "⚠️ ${SRC}: 数据文件不存在，按 0 计"
              printf '{"scrapedAt":"%s","source":"%s","totalListings":0,"withPrice":0,"priceOnRequest":0,"listings":[]}' \
                "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$SRC" > "$FILE"
            fi
            COUNT=$(python3 -c "import json;print(json.load(open('$FILE')).get('totalListings',0))")
            TOTAL=$((TOTAL + COUNT))
            INTL=$((INTL + COUNT))
            echo "✅ ${SRC}: ${COUNT} 条"
            case "$SRC" in
              agroline)   AGROLINE=$COUNT ;;
              mascus)     MASCUS=$COUNT ;;
              search_api) SEARCH_API=$COUNT ;;
            esac
          done
          DCOUNT=0
          if [ -f scripts/domestic_sellers_data_v2.json ]; then
            DCOUNT=$(python3 -c "import json;print(json.load(open('scripts/domestic_sellers_data_v2.json')).get('totalListings',0))")
            TOTAL=$((TOTAL + DCOUNT))
            echo "✅ domestic: ${DCOUNT} 条"
          else
            echo "⚠️ 国内采集文件不存在"
          fi
          # 逐源计数导出：intl_count = 国际四源之和（**不含 domestic**），供「防假绿」断言分层判定。
          echo "listing_count=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "intl_count=$INTL" >> "$GITHUB_OUTPUT"
          echo "agroline_count=$AGROLINE" >> "$GITHUB_OUTPUT"
          echo "mascus_count=$MASCUS" >> "$GITHUB_OUTPUT"
          echo "search_api_count=$SEARCH_API" >> "$GITHUB_OUTPUT"
          echo "domestic_count=$DCOUNT" >> "$GITHUB_OUTPUT"
          echo "📊 总计: $TOTAL 条（国际 ${INTL} / 国内 ${DCOUNT}）"
          {
            echo "### 📊 Seller Scout 采集明细"
            echo ""
            echo "| 源 | 条数 |"
            echo "| --- | ---: |"
            echo "| agroline | ${AGROLINE} |"
            echo "| mascus | ${MASCUS} |"
            echo "| search_api | ${SEARCH_API} |"
            echo "| **国际合计（不含 domestic）** | **${INTL}** |"
            echo "| domestic | ${DCOUNT} |"
            echo "| **总计** | **${TOTAL}** |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 国际数据 = 境外公开行情，写入 Neon（境外库）合规。
      # 注意：不要在这里再写 step 级 env: DATABASE_URL，会覆盖掉 job 级、并让 if 失效。
      - name: Import international data to database
        id: import
        if: env.DATABASE_URL != ''
        continue-on-error: true
        run: npx tsx scripts/import-seller-scout.ts

      # 🔴 国内导入**按合规要求停用**，不要打开。
      # scripts/import-seller-scout-domestic.ts 会把国内卖方数据（含个人联系信息）
      # 写入 Neon（境外库），撞「中国用户个人数据不得出境」红线。
      # 国内采集的正路是 ECS 上的采集器直写 cn-postgres。
      # 脚本保留在仓库中供 ECS 侧复用，本工作流不再调用。
      - name: Domestic import intentionally disabled (compliance)
        run: echo "⏭️ 国内导入已按合规要求停用：国内数据由 ECS 采集器写入 cn-postgres，不入 Neon"

      - name: Skip import (no DATABASE_URL)
        if: env.DATABASE_URL == ''
        run: echo "⚠️ NEON_DATABASE_URL secret 未配置，跳过数据库导入"

      - name: Upload scrape data as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seller-scout-data-${{ github.run_number }}
          path: |
            scripts/*_data.json
            scripts/*_data_v2.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Report status
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Seller Scout Daily 报告"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "采集条数: ${{ steps.check.outputs.listing_count || 0 }}  (国际 ${{ steps.check.outputs.intl_count || 0 }} / 国内 ${{ steps.check.outputs.domestic_count || 0 }})"
          echo "逐源: agroline=${{ steps.check.outputs.agroline_count || 0 }}  mascus=${{ steps.check.outputs.mascus_count || 0 }}  search_api=${{ steps.check.outputs.search_api_count || 0 }}"
          echo "agroline:   ${{ steps.scrape_agroline.outcome }}"
          echo "mascus:     ${{ steps.scrape_mascus.outcome }}"
          echo "search_api: ${{ steps.scrape_search_api.outcome }}"
          echo "import:     ${{ steps.import.outcome || 'skipped' }}"
          echo "时间: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # 🔴 0 条不许判绿（两层）：① 国际源全 0 ⇒ 空转；② agroline/mascus **任一为 0** ⇒ 硬指标源静默死亡。
      #    防止此前三重容错（continue-on-error / 产物缺失写空 JSON / skipDuplicates 无 update）
      #    再次制造「永远 success 的假绿」——尤其防止 domestic 折进 TOTAL 后掩盖国际源全挂。
      #    首次上线若真 0 条会变红，这是**预期行为**，不要为绕过它而放宽条件。
      - name: Fail if no listings scraped
        if: always()
        run: |
          INTL="${{ steps.check.outputs.intl_count }}"
          AGRO="${{ steps.check.outputs.agroline_count }}"
          MASC="${{ steps.check.outputs.mascus_count }}"
          SEARCH="${{ steps.check.outputs.search_api_count }}"
          # ① 国际源全 0（含 intl_count 缺失）⇒ 空转，判红
          if [ -z "$INTL" ] || [ "$INTL" = "0" ]; then
            echo "❌ 国际源全 0 条（空转）—— 判定失败（防止假绿）"
            exit 1
          fi
          # ② 两个免 key 硬指标源（agroline / mascus）**任一为 0** ⇒ 判红（任一静默归零都是重大丢失）。
          #    注意：search_api 依赖尚未配置的 SEARCH_API_KEY，**不纳入硬指标**，避免误红。
          if [ "$AGRO" = "0" ] || [ "$MASC" = "0" ]; then
            echo "❌ agroline/mascus 有主源为 0 条（硬指标源静默死亡）—— 判定失败"
            exit 1
          fi
          echo "✅ 防假绿断言通过：国际 ${INTL} 条（agroline=${AGRO} / mascus=${MASC} / search_api=${SEARCH}）"
