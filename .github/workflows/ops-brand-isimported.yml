name: "Ops - fix Brand.isImported on .cn"

# ============================================================================
# 一次性运维 workflow：修正 `.cn` 生产库 `Brand.isImported` —— 把「进口品牌重复行」
# 被错误置为 false 的 `isImported` 改回 true（只改这一个字段）。
#
# 背景（bug·条件 B）：.cn 的 Brand 表存在重复行，重复行 isImported=false，导致
#   ① 导出接口（要求 brand.isImported=true）永远同步不到 .com（实测卡住 16 台产品）；
#   ② 前端品牌筛选下拉出现同名双选项。
#   本 workflow 只改 `Brand.isImported`（false→true），**绝不删除 Brand 行**
#   （决策 #10：品牌归一 = B，只归一/映射，不删除既有 Brand 行），**绝不改 Product.brandId**。
#
# 数据安全（本仓库是 PUBLIC，必须严格遵守）：
#   1. SQL 由 runner 内存/临时目录生成，绝不写入仓库、绝不打成 artifact、绝不打印 PII。
#   2. dry / verify 为**只读**，物理上不含任何写语句（生成器内置只读断言强制校验）。
#   3. apply 为 psql **单事务** + ON_ERROR_STOP=1：每句精确 WHERE + 行数断言，
#      任一行数不符立即抛异常 → 整体回滚。
#   4. 传输完整性由 sha256 双向核对，不一致直接中止，绝不执行。
#   5. 执行前后清理 runner 与 ECS 上的临时目录。
#
# 触发方式：
#   A. 手动 workflow_dispatch（首选，需先合并到默认分支才可用）
#        mode=dry    → 只读预检，证明通道可用，零写入
#        mode=verify → 只读复核（apply 之后跑），零写入
#        mode=apply  → 真正写入，必须同时填 confirm=FIX-BRAND-ISIMPORTED
#   B. 兜底通道（当 workflow_dispatch 在非默认分支不可用时 —— 实测会 404）
#        向分支 ops/brand-isimported-gate 推送 .github/ops/brand-isimported-apply：
#          内容 FIX-BRAND-ISIMPORTED → apply ／ VERIFY-BRAND-ISIMPORTED → verify ／ 其余 → dry
#        该文件仅作触发闸门，不参与运行时逻辑。
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry=只读预检；verify=只读复核；apply=真正写入"
        required: true
        default: "dry"
        type: choice
        options:
          - "dry"
          - "verify"
          - "apply"
      confirm:
        description: "mode=apply 时必须填 FIX-BRAND-ISIMPORTED"
        required: false
        default: "none"
        type: string
  push:
    branches:
      - "ops/brand-isimported-gate"
    paths:
      - ".github/ops/brand-isimported-apply"

permissions:
  contents: read

# 绝不并发：同一时刻只允许一个实例接触生产库
concurrency:
  group: ops-brand-isimported
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  WORK_DIR: "ops-brand-out"

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ----------------------------------------------------------------------
      # 闸门：解析本次运行到底是 dry 还是 apply。缺省永远落到 dry（fail-safe）。
      # ----------------------------------------------------------------------
      - name: Resolve mode (fail-safe to dry)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="${INPUT_MODE:-dry}"
            CONFIRM="${INPUT_CONFIRM:-none}"
          else
            MODE=dry
            CONFIRM=""
            if [ -f .github/ops/brand-isimported-apply ]; then
              CONFIRM="$(tr -d '[:space:]' < .github/ops/brand-isimported-apply)"
            fi
            if [ "$CONFIRM" = "FIX-BRAND-ISIMPORTED" ]; then
              MODE=apply
            elif [ "$CONFIRM" = "VERIFY-BRAND-ISIMPORTED" ]; then
              MODE=verify
            fi
          fi
          case "$MODE" in
            dry|verify|apply) ;;
            *) echo "::error::非法 mode: $MODE"; exit 1 ;;
          esac
          if [ "$MODE" = "apply" ] && [ "$CONFIRM" != "FIX-BRAND-ISIMPORTED" ]; then
            echo "::error::mode=apply 但 confirm 不等于 FIX-BRAND-ISIMPORTED，拒绝执行"
            exit 1
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "本次运行 mode = $MODE"

      # ----------------------------------------------------------------------
      # 生成 SQL（dry / verify / apply 三件套 + SHA）。
      # 本生成器无 DB 依赖（自包含），无需安装任何依赖。
      # ----------------------------------------------------------------------
      - name: Generate SQL (self-contained, no DB)
        env:
          OUT_DIR: ${{ github.workspace }}/ops-brand-out
        run: node .github/scripts/gen-brand-isimported-sql.cjs

      - name: Read expected sha256
        id: sha
        run: |
          set -euo pipefail
          SHA="$(cat "$WORK_DIR/SHA")"
          if [ "${#SHA}" -ne 64 ]; then echo "::error::SHA 长度异常"; exit 1; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------------
      # 传给 ECS（整个目录：brandfix.sql + brandfix.pre.sql + brandfix.verify.sql + SHA）
      # ----------------------------------------------------------------------
      - name: Transfer generated SQL to ECS
        uses: appleboy/scp-action@v1
        with:
          host: 101.200.125.199
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "ops-brand-out"
          target: "/opt/cn"

      # ----------------------------------------------------------------------
      # 在 ECS 上执行：先核对 sha256，再按 mode 选择 SQL，psql 单事务执行
      # ----------------------------------------------------------------------
      - name: Execute on ECS (sha256 verified, single transaction)
        uses: appleboy/ssh-action@v1
        env:
          MODE: ${{ steps.gate.outputs.mode }}
          EXPECT_SHA: ${{ steps.sha.outputs.sha }}
        with:
          host: 101.200.125.199
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: MODE,EXPECT_SHA
          script: |
            set -uo pipefail

            echo "==== .cn Brand.isImported 修正 | MODE=${MODE:-unset} ===="
            echo "expect_sha=${EXPECT_SHA:-unset}"

            DIR="$(dirname "$(find /opt/cn/ops-brand-out -name brandfix.sql -type f 2>/dev/null | head -1)")"
            if [ -z "${DIR:-}" ] || [ ! -f "$DIR/brandfix.sql" ] || [ ! -f "$DIR/brandfix.pre.sql" ] || [ ! -f "$DIR/brandfix.verify.sql" ]; then
              echo "::error::ECS 上未找到生成的 SQL 文件，scp 步骤可能失败"
              exit 1
            fi
            echo "workdir=$DIR"
            ls -l "$DIR"

            # 无论成功失败，都在退出前清掉 ECS 上的临时文件
            cleanup() { rm -rf /opt/cn/ops-brand-out; echo "cleanup: 已删除 /opt/cn/ops-brand-out"; }
            trap cleanup EXIT

            ACTUAL_SHA="$(sha256sum "$DIR/brandfix.sql" | awk '{print $1}')"
            echo "actual_sha=$ACTUAL_SHA"
            if [ -z "${EXPECT_SHA:-}" ] || [ "$ACTUAL_SHA" != "$EXPECT_SHA" ]; then
              echo "::error::sha256 不一致，拒绝执行（传输损坏或文件陈旧）"
              exit 1
            fi
            echo "sha256 校验通过"

            # dry    → 只读预检
            # verify → 只读复核（apply 之后跑）
            # apply  → 单事务逐行 UPDATE + 行数断言 + COMMIT
            case "$MODE" in
              apply)
                FILE="$DIR/brandfix.sql"
                echo ">>> APPLY：即将写入 .cn 生产库（单事务，出错整体回滚）"
                ;;
              verify)
                FILE="$DIR/brandfix.verify.sql"
                echo ">>> VERIFY：只读复核，生产库零改动"
                ;;
              *)
                FILE="$DIR/brandfix.pre.sql"
                echo ">>> DRY：只读预检，本轮不写入任何数据"
                ;;
            esac

            docker exec -i cn-postgres sh -c \
              'psql -X -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f -' < "$FILE"
            RC=$?

            if [ "$RC" != "0" ]; then
              echo "::error::psql 退出码 $RC —— 若为 apply，单事务已整体回滚，.cn 库未被修改"
              exit "$RC"
            fi
            echo "==== psql 成功 | MODE=${MODE} ===="

      - name: Cleanup runner workspace
        if: always()
        run: rm -rf ops-brand-out
