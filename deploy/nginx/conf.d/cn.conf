# ============================================================
# .cn 站点 Nginx server 配置
#  - :80 强制 301 跳转 https
#  - :443 配 SSL + 反代 Next.js standalone（upstream app -> app:3000）
#  - HSTS
#
# 证书路径（Let's Encrypt 或阿里云免费 DV）：
#   /etc/nginx/ssl/cn/fullchain.pem
#   /etc/nginx/ssl/cn/privkey.pem
# 挂载路径（docker-compose）：/etc/nginx/ssl <- deploy/nginx/ssl
# ============================================================

# 2026-10-26：upstream 改用 Docker 内嵌 DNS 动态解析
#   nginx >= 1.27.3 支持 upstream 内 resolver 与 server 的 resolve 参数（线上实测 nginx/1.27.5）。
# 事故背景：写死 `server app:3000;` 时，nginx 只在启动/reload 时解析一次 IP，而 CI 每次部署
#   都 --force-recreate app（换 IP）；一旦部署脚本在 reload 之前失败，nginx 就死盯旧 IP
#   ⇒ 全站 502（含静态资源）。动态解析让 IP 变化在 valid=10s 内自动生效。
# 注意：resolve 必须配合 zone 使用。
upstream app {
    zone app 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server app:3000 resolve;
}

# HTTP -> HTTPS 强制跳转
server {
    listen 80;
    server_name usedfarmmach.cn www.usedfarmmach.cn;

    # Let's Encrypt HTTP-01 验证（certbot webroot，见 renew-cn-ssl.sh）
    # 必须放在 301 跳转之前，否则 ACME 挑战请求会被跳到 https 而失败。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 备案前：阿里云会拦截未备案域名的 80/443，此跳转仅在备案后生效。
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主 server
server {
    listen 443 ssl;
    server_name usedfarmmach.cn www.usedfarmmach.cn;

    ssl_certificate     /etc/nginx/ssl/cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cn/privkey.pem;

    # 现代 TLS 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS（含子域，最长 1 年）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 反代到 Next.js standalone 容器
    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;
    }

    # 健康探针（与容器 / compose healthcheck 一致，便于排除）
    location = /zh {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
