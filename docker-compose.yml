# ============================================================
# docker-compose.yml — .cn 国内站（阿里云 ECS 北京）
# 三 service：
#   - nginx：对外 80/443，反代 + SSL
#   - app  ：仅内部网络 app:3000，不暴露宿主机端口
#   - postgres：ECS 本地 PG（docker postgres:17 + volume，数据不出境，零额外采购）
#
# 运行时环境变量由 ECS 主机 /opt/cn/.env.cn 提供（env_file），
# 绝不通过 CI 注入（避免进入 CI 日志）。
#
# 部署基目录约定（ECS 主机）：/opt/cn
#   /opt/cn/docker-compose.yml   <- 本文件
#   /opt/cn/.env.cn              <- 运行时 secrets（主机持有）
#   /opt/cn/deploy/nginx/*       <- nginx 配置 + ssl 证书
#
# 使用方式（CI 通过 deploy 用户 SSH 后在 /opt/cn 执行）：
#   镜像包已由 deploy/deploy-cn.sh 从 OSS 下载并 docker load（tag: usedfarmmach-cn:<sha>）：
#   export CN_IMAGE=usedfarmmach-cn:<git commit sha>
#   docker compose -f /opt/cn/docker-compose.yml --env-file /opt/cn/.env.cn up -d app
# ============================================================
services:
  nginx:
    image: nginx:1.27-alpine
    container_name: cn-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL 证书挂载（Let's Encrypt / 阿里云 DV）：将证书放到 ./deploy/nginx/ssl/cn/
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - cn-net

  app:
    image: ${CN_IMAGE}
    # 镜像一律由 deploy-cn.sh docker load 到本地（OSS 方案无 registry），
    # 禁止 compose 尝试从远端拉取。
    pull_policy: never
    container_name: cn-app
    # 不暴露宿主机端口，仅内部网络可达（由 nginx 反代）
    expose:
      - "3000"
    env_file:
      - /opt/cn/.env.cn
    # Next.js 14 standalone server.js 用 process.env.HOSTNAME || '0.0.0.0' 决定监听地址。
    # Docker 把容器 HOSTNAME 设为容器 ID，server.js 据此绑到 bridge 网络 IP（172.18.x.x），
    # 导致 127.0.0.1:3000 无法访问（healthcheck 永远 Connection refused）。
    # 显式设 0.0.0.0 让 Next.js 绑所有接口，环回也通。
    environment:
      HOSTNAME: 0.0.0.0
      SITE: cn
      NEXT_PUBLIC_SITE: cn
    # 依赖本地 PG（ECS 内 docker postgres:16）；PG 健康后才启动 app，避免迁移竞态
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # 注：alpine 默认无 curl，使用 busybox wget（与 Dockerfile.cn HEALTHCHECK 一致）
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/zh"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - cn-net

  postgres:
    image: postgres:17-alpine
    container_name: cn-postgres
    environment:
      POSTGRES_USER: ${CN_DB_USER:-cn_app}
      POSTGRES_PASSWORD: ${CN_DB_PASSWORD:-change_me_strong_password}
      POSTGRES_DB: ${CN_DB_NAME:-usedfarmmach_cn}
    volumes:
      - cn-pg-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CN_DB_USER:-cn_app} -d ${CN_DB_NAME:-usedfarmmach_cn}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - cn-net

volumes:
  cn-pg-data:

networks:
  cn-net:
    driver: bridge
