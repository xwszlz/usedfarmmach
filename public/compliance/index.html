 मिले, और प्लेटफ़ॉर्म सिर्फ सेवा शुल्क ले।","why":"पैसा प्लेटफ़ॉर्म के खाते से होकर बाहर जाने पर इसे बिना लाइसेंस भुगतान व्यवसाय माना जा सकता है (जिसे “दूसरा निपटान” कहते हैं)।"},{"topic":"प्लेटफ़ॉर्म अनुपालन","title":"लॉन्च से पहले क्या आपने जाँच लिया था कि कौन-कौन से लाइसेंस चाहिए?","desc":"वेबसाइट, ऐप या मिनी-प्रोग्राम के लिए आवश्यक लाइसेंस और पंजीकरण आपने लॉन्च से पहले बिंदु-दर-बिंदु जाँच लिए थे।","opts":["हर व्यवसाय की अलग पहचान की और ज़रूरी लाइसेंस व पंजीकरण करवाए","पहले लॉन्च करता हूँ, जाँच हुई तो देखेंगे","प्रोग्रामर से पूछा, उसने कहा ज़रूरत नहीं"],"rule":"पहले “पैसा लेते हैं या नहीं + बाहर से आने वालों को जगह देते हैं या नहीं + क्या काम करते हैं” के आधार पर वर्गीकृत करें, फिर लाइसेंस देखें; लाइसेंस से छूट हो तब भी पंजीकरण ज़रूरी है, और दायरे से बाहर काम करना बिना लाइसेंस काम करने जैसा ही दंडनीय है।","why":"लाइसेंस लेकर दायरे से बाहर काम करना भी वैसा ही दंडनीय है जैसे बिना लाइसेंस काम करना; “प्रोग्रामर ने कहा ज़रूरत नहीं” अनुपालन का आधार नहीं है।"},{"topic":"उद्यम की नींव","title":"क्या आपने कभी व्यक्तिगत संयुक्त गारंटी पर हस्ताक्षर किए हैं?","desc":"कंपनी के ऋण के लिए आपने व्यक्तिगत संयुक्त गारंटी दी, या घर को गिरवी रखा।","opts":["नहीं, पारिवारिक संपत्ति और कंपनी पूरी तरह अलग हैं","हाँ, बैंक ने कहा यह सिर्फ औपचारिकता है","हाँ, पर शायद यह सामान्य गारंटी है, है न?"],"rule":"गारंटी पत्र में “संयुक्त” शब्द देखें: हो सके तो हस्ताक्षर न करें, और करना ही पड़े तो केवल सामान्य गारंटी करें, ऊपरी सीमा स्पष्ट लिखें, और वह राशि भीतर रखें जिसे आप उठा सकते हैं।","why":"संयुक्त दायित्व का अर्थ है कि कंपनी भुगतान न कर पाए तो आपका घर और जमा सीधे ज़ब्त हो सकते हैं।"},{"topic":"उद्यम की नींव","title":"क्या कंपनी का पैसा कभी आपके निजी खाते में आया है?","desc":"निजी और कंपनी के खाते मिले-जुले इस्तेमाल होते हैं, कभी-कभी माल का भुगतान निजी कार्ड से जाता है, या पूँजी बहुत ज़्यादा लिखी गई है।","opts":["नहीं, निजी और कंपनी खाते सख़्ती से अलग रखता हूँ","कभी-कभी निजी कार्ड से लेन-देन किया","हमेशा यही करता हूँ, आसान है"],"rule":"सही कानूनी रूप चुनना सिर्फ शुरुआत है: खाते अलग रखें, माल का भुगतान निजी कार्ड में न आने दें, और पूँजी अत्यधिक न लिखें; अगर ऐसा न करें तो “सीमित दायित्व”, व्यक्तित्व मिश्रण या अंशदान की त्वरित मांग के कारण समाप्त हो सकता है।","why":"खाते मिले ही कि “सीमित दायित्व” की यह दीवार निष्पादन न्यायालय सीधे तोड़ सकता है।"},{"topic":"उद्यम की नींव","title":"अगर यह सारा पैसा चला गया तो जीवन पर क्या असर होगा?","desc":"अगर लगाया हुआ पैसा बिलकुल न बचे, तो क्या गृह ऋण, बच्चों की परवरिश या इलाज पर असर पड़ेगा?","opts":["सब खराब हो जाए तो भी मूल जीवन पर असर नहीं","थोड़ी तंगी होगी, पर संभाल लूँगा","पैसा उधार लिया, या परिवार वालों का पैसा लगाया"],"rule":"पहले वह राशि तय करें जिसके पूरी तरह चले जाने पर भी गृह ऋण, बच्चों की परवरिश और इलाज पर असर न पड़े; परिवार और उधार का पैसा इसमें शामिल न करें, और उससे ऊपर निवेश न करें।","why":"जो राशि आप उठा सकते हैं उसे पहले ही तय कर लेना चाहिए, न कि आधे नुकसान के बाद खुद से पूछना कि स्वीकार है या नहीं।"},{"topic":"टेक्निकल रेड लाइनें","title":"उस साइड प्रोजेक्ट से पहले आपने सबसे पहले क्या पूछा था?","desc":"वेब स्क्रैपिंग, स्क्रिप्ट, हैक या टिकट बुकिंग टूल जैसे कामों में, शुरुआत से पहले आपके मन में पहला सवाल क्या था?","opts":["पहले पूछता हूँ “क्या सामने वाला शिकायत दर्ज कराएगा?”, तब तय करता हूँ","पहले देखता हूँ कि तकनीकी रूप से बन सकता है या नहीं","सब कर रहे हैं, शायद कोई बात नहीं"],"rule":"शुरुआत से पहले “क्या तकनीकी रूप से संभव है?” नहीं, बल्कि “क्या निर्माता, प्लेटफ़ॉर्म या कंपनी शिकायत दर्ज कराएगी?” पूछें — लॉग निकाले जा सकते हैं, और “कोई नहीं देख रहा” भ्रम है।","why":"तकनीकी संभाव्यता का अर्थ कानूनी अनुमति नहीं है; बैकएंड लॉग सुरक्षित रहते हैं और बाद में पूरा निकाला जा सकता है।"},{"topic":"टेक्निकल रेड लाइनें","title":"क्या पिछली कंपनी वाली चीज़ें अभी भी आपके पास हैं?","desc":"सोर्स कोड, ग्राहक सूची, सिस्टम खाते — छोड़ने के बाद भी आपके पास हैं, और आप कभी-कभी देखने भी जाते हैं।","opts":["सब लौटा दिया और अनुमतियाँ रद्द हो गईं","संदर्भ के लिए कुछ सामग्री रख ली","खाता अभी भी है, कभी-कभी देखने जाता हूँ"],"rule":"छोड़ते समय सब लौटाएँ और अनुमतियाँ रद्द कराएँ: डेटाबेस न हटाएँ, कोई पिछला दरवाज़ा न छोड़ें और सोर्स कोड न ले जाएँ; खाते की अनुमति नौकरी छोड़ते ही समाप्त हो जाती है, बकाया वेतन के लिए मध्यस्थता करें, और कोड व ग्राहक सूची कंपनी की संपत्ति है।","why":"नौकरी छोड़ने के बाद खाते की अनुमति अपने आप खत्म हो जाती है, इसलिए दोबारा लॉगिन “देखना” नहीं रहकर बिना अनुमति पहुँच बन जाता है।"},{"topic":"आम आदमी के लिए आपराधिक जोखिम","title":"क्या किसी ने कभी आपका कार्ड या OTP माँगा है?","desc":"बैंक कार्ड, खाता या OTP किसी और को देना, या किसी की “फ़ेशियल पहचान” करके ऋण दिलाना या गवाही देना।","opts":["कभी नहीं, कुछ भी किसी को नहीं देता","एक बार दोस्त के लिए पैसा लिया था","गवाह के लिए फ़ेशियल पहचान की, ऋण तो नहीं है न?"],"rule":"कार्ड, खाता और OTP किसी को न दें: देना अपने आप में अवैध है, और “पता नहीं था” का अनुमान लाभ की राशि व असामान्य लेन-देन से लगाया जाता है; जानबूझकर ऐसा करना साइबर अपराध में सहायता का अपराध है।","why":"फ़ेशियल पहचान या हस्ताक्षर के पल उधार लेने वाला आप होते हैं; बिचौलिए को सज़ा मिलने पर भी आपका ऋण माफ़ नहीं होता।"},{"topic":"आपदा में राहत","title":"अगर सच में बुलाया गया तो क्या आपको पहला कदम पता है?","desc":"बुलाए जाने या हिरासत में लेने पर पहली पूछताछ में क्या करना चाहिए, और 37 दिनों की क्या अवधि है।","opts":["पता है: तुरंत वकील माँगें, बयान शब्द-शब्द पढ़ें, 37 दिन गिरफ़्तारी के आदेश की अवधि है","पता है कि वकील चाहिए, पर कब माँगना है नहीं जानता","बिलकुल पता नहीं, लगता है सहयोग करना ही काफ़ी है"],"rule":"बुलाए जाने या हिरासत में लेने पर: पहली पूछताछ में ही वकील माँगें, हस्ताक्षर करने से पहले बयान शब्द-शब्द पढ़ लें, कोई निजी समझौता न करें, रिकॉर्ड न हटाएँ और जो नहीं किया उसे स्वीकार न करें; 37 दिनों की गिरफ़्तारी अवधि चूक जाने पर वापस नहीं आती।","why":"बयान पर हस्ताक्षर होते ही उसे पलटना बहुत कठिन है; 37 दिन गिरफ़्तारी के आदेश से बचने की अहम अवधि है, इसे चूकने पर आप कमज़ोर स्थिति में रह जाते हैं।"},{"topic":"निर्णय का सिद्धांत","title":"जो डेटा आप जाँच नहीं पा रहे हैं, उसे आप लिखते कैसे हैं?","desc":"प्रस्ताव या रिपोर्ट लिखते समय ऐसा कानून, आँकड़ा या मामला मिले जिसे आप जाँच न सकें।","opts":["खुला लिखते हैं “जाँच नहीं मिली”, आँकड़े नहीं बनाते","कोई मिलता-जुलता स्रोत ढूँढ़कर जोड़ देते हैं","AI ने बनाया है, शायद ठीक होगा"],"rule":"जब तक शब्द-शब्द जाँचे जा सकने वाले आधिकारिक आँकड़े न हों, खुला लिखें “जाँच नहीं मिली”, न आँकड़े बनाएँ न मामले; उद्धरण करते समय मूल पाठ शब्द-शब्द मिलाएँ और आपसी जाँच करें।","why":"एक बनाया हुआ आँकड़ा पूरी सामग्री की विश्वसनीयता खत्म कर देता है — यही पूरी किताब की प्रमाण-ईमानदारी की नीची रेखा है।"}]},"zh":{"ui":{"pageTitle":"创业者合规体检 · 你最该先做的 3 件事","brandName":"创业者合规避坑官","brandSource":"源自《高性价比人生指南》","brandMark":"避","introH1":"你以为没事，<br>其实正在<em>踩红线<\/em>。","introLede":"10 道题，给你的创业动作做一次<strong>合规体检<\/strong>。<br>答完告诉你：<strong>现在最该先做的 3 件事<\/strong>，以及为什么。","feat1":"<b>只问真实动作<\/b>——钱怎么收、证怎么办、担保签没签，不讲大道理。","feat2":"<b>按风险排序<\/b>——先救最要命的那一条，而不是列一堆\"建议你都要注意\"。","feat3":"<b>每条都有出处<\/b>——答案来自已核验的 44 张避坑卡，标注原文节条。","startBtn":"开始体检 · 约 2 分钟","fineIntro":"结果可生成图片保存分享 · 完全免费 · 不收集任何信息","qCount":"第 <b>{n}<\/b> / 10 题","qBack":"← 上一题","vLab":"体 检 结 果","secTitle":"你现在最该先做的 3 件事","shareTitle":"生成我的体检结果卡","shareDesc":"长按图片保存到相册，发微信群 / 朋友圈<br>让跟你一起创业的人也测一遍","genBtn":"生成分享图","resultAlt":"体检结果卡，长按保存","saveTip":"↑ 长按上方图片 → 保存到相册 → 发出去","restartBtn":"重新测一次","fineResult":"源自《高性价比人生指南》（CC BY 4.0）· 垂直蒸馏 · 同步日期 2026-11-16<br>本工具为通用自查，不替代律师、医生、会计的专业判断；政策类条目以官方现行文本为准。","cardHead":"创 业 者 合 规 体 检","cardTitle":"你最该先做的","cardTail":"件事","cardScore":"风险分","cardRank":"优先级","cardSource":"来源","cardFooter1":"完整 44 张避坑卡","cardFooter2":"扫码关注「我AI您」· 全部内容免费开放","cardQr":"二维码","cardLicense":"源自《高性价比人生指南》CC BY 4.0 · 同步 2026-11-16","toastSaved":"已生成，长按图片保存","note":"法律表述以中文原文为准"},"grades":["低危","中危","高危"],"descs":["你的基本防线是完整的。保持住，并留意下面这几条加固项。","有几处松动，其中至少一条一旦出事代价不小。按下面顺序补。","多条红线同时亮起。别想着一次全改，先做排在最前面的那件事。"],"qs":[{"topic":"平台合规","title":"买家的钱，先到谁的账户？","desc":"用户付款后，钱先进了平台自己的账户，你再提现或转给卖家。","opts":["钱直接结给卖家，平台只收服务费","先到平台账户，我再转给卖家","用我个人微信或银行卡代收"],"rule":"钱不进平台自己的账户：接持牌机构分账，钱直接结给卖家，平台只收服务费。","why":"钱过平台账户再转出，容易被认定无证经营支付业务（俗称\"二清\"）。"},{"topic":"平台合规","title":"上线前，你确认过要办什么证吗？","desc":"网站、App 或小程序要办的证照和备案，你在上线前逐项核对过。","opts":["按业务逐项定性，该办的证、该备的案都做了","先上线，等有人查了再说","问过程序员，他说不用办"],"rule":"先按\"收不收钱 + 让不让入驻 + 做什么业务\"定性再对证照；免办证也要备案，超范围与无证同罚。","why":"办了证但超范围经营，和没证一样罚；\"程序员说不用\"不是合规依据。"},{"topic":"创业家底","title":"你签过个人连带担保吗？","desc":"为公司贷款签了个人连带担保，或用家里的房子做了抵押。","opts":["没有，家庭资产和公司完全隔开","签了，银行说只是走个形式","签了，但应该是一般保证吧"],"rule":"担保书看\"连带\"二字：能不签就不签，非签不可只签一般保证、写清上限，且压在\"亏得起\"的数内。","why":"连带责任意味着公司还不上时，你的房子和存款直接被执行。"},{"topic":"创业家底","title":"公司的钱，进过你的个人卡吗？","desc":"公私账混着用，货款偶尔走个人卡，或者注册资本写得特别高。","opts":["没有，公私账严格分开","偶尔用个人卡周转过","一直这么干，方便"],"rule":"选对主体只是前提：公私账分开、货款别进个人卡、注册资本别虚高，否则\"有限\"会因人格混同或认缴加速而失效。","why":"账一混，\"有限责任\"这道防火墙就可能被执行法院直接击穿。"},{"topic":"创业家底","title":"这笔钱全亏光，生活会怎样？","desc":"投进去的钱如果一分不剩，会不会影响房贷、养孩子或看病。","opts":["全亏光也不影响基本生活","会有点紧，但能扛过去","借了钱，或者动用了家人的钱"],"rule":"先定\"全亏光也不影响房贷、养孩子、看病\"的数，家人的钱和借来的钱不算进去，超过就不投。","why":"亏得起的数要事先算死，而不是亏到一半再问自己能不能接受。"},{"topic":"技术人红线","title":"做那个副业前，你先问了什么？","desc":"爬虫、脚本、外挂、抢票工具这类活儿，动手前你脑子里第一个问题。","opts":["先问\"对方会不会报案\"，再决定做不做","先看看技术上能不能做出来","别人都在做，应该没事"],"rule":"动手前不问\"技术上能不能做\"，问\"厂商、平台、公司会不会报案\"——日志可被调取，\"没人管\"是错觉。","why":"技术可行不等于法律允许；后台日志留存，事后能被完整调取。"},{"topic":"技术人红线","title":"前公司的东西，还在你手里吗？","desc":"源码、客户名单、系统账号，离职后你仍然保留着，甚至偶尔还上去看。","opts":["都交清了，权限也注销了","留了点资料当参考","还留着账号，偶尔上去看看"],"rule":"离职交清权限、不删库不留后门不带源码：账号授权随离职终止，欠薪走仲裁，代码和客户名单归公司。","why":"离职后账号授权自动终止，再登录就不再是\"查看\"，而是未授权访问。"},{"topic":"普通人刑事","title":"有人借过你的卡或验证码吗？","desc":"银行卡、账号、验证码借给别人，或者帮人\"刷脸\"办贷款、做见证。","opts":["从来没有，一律不外借","帮朋友收过一次钱","刷脸做过见证，不算贷款吧"],"rule":"卡、账号、验证码一律不外借：出借本身违法，\"不知情\"由好处费和异常流水推定，明知即帮信罪。","why":"刷脸或签字那一刻，借款人就是你；中介被判刑，也不会免掉你的债。"},{"topic":"出事救济","title":"真被传唤，你知道第一步吗？","desc":"被传唤或刑拘时，第一次讯问该做什么，37 天又是什么窗口。","opts":["清楚：当场请律师、笔录逐字看、37 天是批捕窗口","知道要请律师，但不知道什么时候请","完全不知道，想着配合就行"],"rule":"被传唤或刑拘：第一次讯问就请律师、笔录逐字看完再签、不私了不删记录不认没做过的事；37 天批捕窗口错过就没了。","why":"笔录一签就很难推翻；37 天是争取不批捕的关键窗口，错过了就被动。"},{"topic":"判断算法","title":"查不到的数据，你怎么写？","desc":"写方案、做汇报时，遇到查不到的法条、数字或案例。","opts":["明写\"查不到\"，不编数字","找个差不多的来源凑上去","AI 生成的，应该差不多"],"rule":"没有可逐字核对的官方数据就明写\"查不到\"，不编数字、不编案例；引用逐字核对原文并互相校验。","why":"一个编出来的数字，会让整份材料的可信度归零——这是全书的证据诚信底线。"}] // 选项顺序按题固定洗牌一次；语言切换只换文字，不换顺序与分值
function shuffleOpts(q, i) {
  q._i = i;
  var idx = q.opts.map(function (_, k) { return k; });
  for (var k = idx.length - 1; k > 0; k--) {
    var j = Math.floor(Math.random() * (k + 1));
    var t = idx[k]; idx[k] = idx[j]; idx[j] = t;
  }
  q.order = idx;
  rebuildOpts(q);
}
function rebuildOpts(q) {
  var tr = L().qs[q._i];
  q.shuffled = q.order.map(function (k) {
    return [(tr && tr.opts[k]) || q.opts[k][0], q.opts[k][1]];
  });
}

/* ============ 生成可长按保存的结果图 ============ */
function wrap(ctx, text, maxW) {
  var chars = text.split('');
  var lines = [], cur = '';
  for (var i = 0; i < chars.length; i++) {
    var t = cur + chars[i];
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = chars[i]; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function wrapSmart(ctx, text, maxW) {
  if (LANG === 'zh') return wrap(ctx, text, maxW);
  var words = String(text).split(/\s+/), lines = [], cur = '';
  for (var i = 0; i < words.length; i++) {
    var w = words[i]; if (!w) continue;
    var t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function makeCard() {

  g.addColorStop(0, '#1e3a5f'); g.addColorStop(1, '#2d5a8e');

  // 顶部金色细线

  x.textAlign = 'left';

  x.fillStyle = '#ffffff';
  x.font = '800 62px system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
  x.fillText(ui('cardTitle'), 60, 170);
  x.fillStyle = '#ffd54f';
  x.fillText(N + ' ' + ui('cardTail'), 60, 246);

  // 评级胶囊

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
