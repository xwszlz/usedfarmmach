<!DOCTYPE html>
<html lang="zh-CN" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>创业者合规体检 · 你最该先做的 3 件事</title>
<!--
  创业者合规体检 H5 — 单文件、零依赖、可静态托管
  内容源自《高性价比人生指南》创业合规切片（CC BY 4.0），垂直蒸馏为「创业者合规避坑官」skill。
  出处：https://github.com/eternity4719/HowToLiveBetter
  许可证：https://creativecommons.org/licenses/by/4.0/
  改动：按创业/平台/技术人自查场景重写为 10 道自检题与结果建议。
  同步日期：2026-11-16（上游版本）。政策类条目可能变化，以官方现行文本为准。

  【替换公众号二维码】把下方 id="qr" 的 img 的 src 换成你自己的公众号二维码图片地址即可。
  结果图生成时会自动把这张二维码画进卡片底部。
-->
<style>
  :root {
    --bg: #eef2f7;
    --card: #ffffff;
    --ink: #1e3a5f;
    --ink-2: #4a5f7a;
    --gold: #c9a227;
    --red: #d93025;
    --green: #1e8e3e;
    --amber: #f9ab00;
    --line: #dfe6ee;
    --shadow: 0 10px 30px rgba(30, 58, 95, .10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(150deg, #f8fafc 0%, #eef2f7 55%, #e6edf5 100%);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 520px; margin: 0 auto; min-height: 100vh; position: relative; }
  .screen { display: none; padding: 26px 20px 40px; animation: fade .28s ease; }
  .screen.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    background: linear-gradient(135deg, var(--ink), #2d5a8e);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700;
  }
  .brand .txt { font-size: 13px; color: var(--ink-2); letter-spacing: .5px; }
  .brand .txt b { color: var(--ink); }

  .intro-h1 { font-size: 30px; line-height: 1.3; margin: 0 0 14px; font-weight: 800; letter-spacing: -.5px; }
  .intro-h1 em { font-style: normal; color: var(--gold); }
  .intro-lede { font-size: 15px; line-height: 1.85; color: var(--ink-2); margin: 0 0 24px; }
  .intro-lede strong { color: var(--ink); }

  .feature-list { list-style: none; padding: 0; margin: 0 0 28px; }
  .feature-list li {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px; font-size: 14px; line-height: 1.6;
    display: flex; gap: 12px; align-items: flex-start; box-shadow: 0 2px 8px rgba(30,58,95,.04);
  }
  .feature-list .n {
    flex: none; width: 24px; height: 24px; border-radius: 7px; background: #f0f4f9;
    color: var(--ink); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .feature-list b { color: var(--ink); }

  .btn {
    display: block; width: 100%; border: none; border-radius: 14px; padding: 16px;
    font-size: 16px; font-weight: 700; cursor: pointer; text-align: center;
    background: linear-gradient(135deg, var(--ink), #2d5a8e); color: #fff;
    box-shadow: 0 8px 20px rgba(30,58,95,.22); transition: transform .15s, box-shadow .15s;
    font-family: inherit;
  }
  .btn:active { transform: translateY(1px); box-shadow: 0 4px 12px rgba(30,58,95,.2); }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
  .btn.gold { background: linear-gradient(135deg, #b8901f, var(--gold)); box-shadow: 0 8px 20px rgba(201,162,39,.25); }
  .btn + .btn { margin-top: 10px; }

  .fine { font-size: 11px; color: #8a99ad; line-height: 1.7; margin-top: 18px; text-align: center; }

  /* 答题页 */
  .q-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .q-count { font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .q-count b { color: var(--ink); font-size: 17px; }
  .q-topic {
    font-size: 11px; padding: 4px 10px; border-radius: 20px; background: #edf2f8;
    color: var(--ink); font-weight: 700; letter-spacing: .5px;
  }
  .progress { height: 5px; background: #dde5ee; border-radius: 5px; overflow: hidden; margin-bottom: 26px; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--ink), var(--gold)); width: 0; transition: width .3s ease; }
  .q-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 20px; box-shadow: var(--shadow); }
  .q-title { font-size: 20px; font-weight: 800; line-height: 1.45; margin: 0 0 10px; }
  .q-desc { font-size: 14px; color: var(--ink-2); line-height: 1.75; margin: 0 0 22px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    border: 1.5px solid var(--line); border-radius: 12px; padding: 14px 16px;
    font-size: 14px; line-height: 1.55; cursor: pointer; background: #fff;
    display: flex; gap: 12px; align-items: flex-start; transition: border-color .15s, background .15s;
    font-family: inherit; color: var(--ink); text-align: left; width: 100%;
  }
  .opt:active { border-color: var(--ink); background: #f7f9fc; }
  .opt .k {
    flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line);
    display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--ink-2); font-weight: 700;
  }
  .opt.sel { border-color: var(--ink); background: #f2f6fb; }
  .opt.sel .k { background: var(--ink); color: #fff; border-color: var(--ink); }
  .q-back { margin-top: 16px; font-size: 13px; color: var(--ink-2); background: none; border: none; cursor: pointer; padding: 8px 0; font-family: inherit; }
  .q-back:disabled { opacity: .35; }

  /* 结果页 */
  .verdict {
    background: linear-gradient(140deg, #1e3a5f, #2d5a8e); color: #fff;
    border-radius: 20px; padding: 26px 22px; text-align: center; box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .verdict .lab { font-size: 12px; opacity: .75; letter-spacing: 2px; }
  .verdict .grade { font-size: 44px; font-weight: 800; margin: 8px 0 4px; line-height: 1.1; }
  .verdict .grade.red { color: #ff8a80; }
  .verdict .grade.amber { color: #ffd54f; }
  .verdict .grade.green { color: #a5d6a7; }
  .verdict .score { font-size: 13px; opacity: .85; }
  .verdict .desc { font-size: 14px; line-height: 1.7; margin-top: 14px; opacity: .95; }

  .sec-title { font-size: 16px; font-weight: 800; margin: 24px 0 12px; display: flex; align-items: center; gap: 8px; }
  .sec-title::before { content: ""; width: 4px; height: 16px; border-radius: 4px; background: var(--gold); }
  .action {
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--red);
    border-radius: 12px; padding: 16px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(30,58,95,.04);
  }
  .action .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .action .tag { font-size: 11px; font-weight: 700; color: var(--red); background: #fdecea; padding: 3px 9px; border-radius: 20px; }
  .action .rank { font-size: 11px; color: #9aa8b8; }
  .action .rule { font-size: 14px; line-height: 1.75; color: var(--ink); font-weight: 600; }
  .action .why { font-size: 12px; color: var(--ink-2); margin-top: 8px; line-height: 1.6; }
  .action .src { font-size: 11px; color: #9aa8b8; margin-top: 8px; }

  .share-box { background: #fff; border: 1px dashed var(--gold); border-radius: 14px; padding: 18px; margin-top: 20px; text-align: center; }
  .share-box .t { font-size: 14px; font-weight: 800; margin-bottom: 6px; }
  .share-box .s { font-size: 12px; color: var(--ink-2); line-height: 1.7; }
  .share-tip { font-size: 12px; color: var(--ink-2); text-align: center; margin: 12px 0 4px; line-height: 1.6; }
  #resultImg { display: none; width: 100%; border-radius: 12px; box-shadow: var(--shadow); margin: 14px 0; }
  #qr { display: none; }

  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
    background: rgba(30,58,95,.95); color: #fff; padding: 12px 20px; border-radius: 24px;
    font-size: 13px; opacity: 0; transition: all .25s; pointer-events: none; z-index: 99; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #exportCanvas { display: none; }

  /* 多语言：语言切换器 + 阿拉伯语 RTL */
  .langbar { position: fixed; top: 10px; right: 10px; z-index: 60; }
  .langbar select {
    background: rgba(255,255,255,.94); border: 1px solid var(--line); color: var(--ink);
    border-radius: 20px; padding: 6px 10px; font-size: 12px; font-family: inherit;
    box-shadow: 0 2px 8px rgba(30,58,95,.14); max-width: 130px;
  }
  [dir="rtl"] .langbar { right: auto; left: 10px; }
  [dir="rtl"] .opt { text-align: right; }
  [dir="rtl"] .fine, [dir="rtl"] .share-tip { text-align: right; }
</style>
</head>

<div id="app">

  <!-- 语言切换：官网 About 入口带 ?lang=xx；公众号直接打开默认中文，用户可手动切换 -->
  <div class="langbar"><select id="langPick" onchange="setLang(this.value)" aria-label="Language / 语言"></select></div>

  <!-- 封面 -->
  <section class="screen active" id="s-intro">
    <div class="brand"><div class="mark" id="brandMark"></div><div class="txt"><b id="brandName"></b> · <span id="brandSource"></span></div></div>
    <h1 class="intro-h1" id="introH1"></h1>
    <p class="intro-lede" id="introLede"></p>
    <ul class="feature-list" id="features"></ul>
    <button class="btn" id="startBtn" onclick="startQuiz()"></button>
    <p class="fine" id="fineIntro"></p>
  </section>

  <!-- 答题 -->
  <section class="screen" id="s-quiz">
    <div class="q-head">
      <div class="q-count" id="qCount"></div>
      <div class="q-topic" id="qTopic"></div>
    </div>
    <div class="progress"><i id="prog"></i></div>
    <div class="q-card">
      <h2 class="q-title" id="qTitle"></h2>
      <p class="q-desc" id="qDesc"></p>
      <div class="options" id="qOpts"></div>
    </div>
    <button class="q-back" id="qBack" onclick="prevQ()"></button>
  </section>

  <!-- 结果 -->
  <section class="screen" id="s-result">
    <div class="verdict">
      <div class="lab" id="vLab"></div>
      <div class="grade" id="vGrade"></div>
      <div class="score" id="vScore"></div>
      <div class="desc" id="vDesc"></div>
    </div>

    <div class="sec-title" id="secTitle"></div>
    <div id="actions"></div>

    <div class="share-box">
      <div class="t" id="shareTitle"></div>
      <div class="s" id="shareDesc"></div>
    </div>
    <button class="btn gold" id="genBtn" onclick="makeCard()"></button>
    <img id="resultImg" alt="">
    <p class="share-tip" id="saveTip" style="display:none"></p>
    <div style="height:10px"></div>
    <button class="btn ghost" id="restartBtn" onclick="restart()"></button>
    <p class="fine" id="fineResult"></p>
    <p class="fine" id="langNote" style="display:none"></p>
  </section>

var I18N = {"en":{"ui":{"pageTitle":"Founder Compliance Checkup · The 3 Things to Do First","brandName":"Founder Compliance Guard","brandSource":"From The High-Value Life Guide","brandMark":"C","introH1":"You think it's fine,<br>but you're <em>crossing red lines<\/em>.","introLede":"10 questions to give your founder actions a <strong>compliance checkup<\/strong>.<br>Answer them and find out: <strong>the 3 things to do first right now<\/strong>, and why.","feat1":"<b>Only real actions<\/b> — how you get paid, how you get licensed, whether you signed a guarantee; no lofty theories.","feat2":"<b>Ranked by risk<\/b> — fix the most critical one first, instead of listing a bunch of 'you should watch out for all these'.","feat3":"<b>Every answer has a source<\/b> — answers come from 44 verified pitfall-avoidance cards, with source sections cited.","startBtn":"Start checkup · about 2 minutes","fineIntro":"Generate an image of your result to save and share · Completely free · No information collected","qCount":"Question <b>{n}<\/b> / 10","qBack":"← Previous","vLab":"R E S U L T","secTitle":"The 3 things you should do first right now","shareTitle":"Generate my result card","shareDesc":"Long-press the image to save it, then share to a group chat / Moments<br>Let your fellow founders take the test too","genBtn":"Generate share image","resultAlt":"Checkup result card, long-press to save","saveTip":"↑ Long-press the image above → Save to album → Share it","restartBtn":"Retake the test","fineResult":"From The High-Value Life Guide (CC BY 4.0) · Vertical distillation · Synced 2026-11-16<br>This tool is a general self-check and does not replace the professional judgment of lawyers, doctors, or accountants; policy items follow the current official text.","cardHead":"F O U N D E R   C O M P L I A N C E   C H E C K U P","cardTitle":"Your top","cardTail":"actions","cardScore":"Risk score","cardRank":"Priority","cardSource":"Source","cardFooter1":"All 44 pitfall-avoidance cards","cardFooter2":"Scan to follow 'Wo AI Nin' · All content is free","cardQr":"QR code","cardLicense":"From The High-Value Life Guide · CC BY 4.0 · Synced 2026-11-16","toastSaved":"Generated — long-press the image to save","note":"Note: legal wording is subject to the original Chinese text."},"grades":["Low risk","Medium risk","High risk"],"descs":["Your basic defenses are intact. Keep it up, and pay attention to the reinforcement items below.","There are a few weak spots, and at least one of them could be costly if things go wrong. Fix them in the order below.","Several red lines are lit up at once. Don't try to fix everything at once — start with the one at the top of the list."],"qs":[{"topic":"Platform","title":"Whose account does the buyer's money land in first?","desc":"After the user pays, the money first goes into the platform's own account, then you withdraw it or transfer it to the seller.","opts":["The money is settled directly to the seller; the platform only charges a service fee","It first goes to the platform account, then I transfer it to the seller","I collect it through my personal WeChat or bank card"],"rule":"Money should not enter the platform's own account: use a licensed institution for fund splitting, settle the money directly to the seller, and let the platform charge only a service fee.","why":"When money passes through the platform account and is then transferred out, it is easily deemed unlicensed operation of a payment business (commonly called 'second clearing')."},{"topic":"Platform","title":"Before launch, did you confirm which licenses you need?","desc":"Did you check item by item, before launch, the licenses and filings required for your website, app, or mini program?","opts":["I classified each business activity and completed all required licenses and filings","Launch first, deal with it if someone checks","I asked the developer, who said no license was needed"],"rule":"First classify by 'does it take money + does it allow third-party onboarding + what business is it' before matching licenses; even if a license is exempt, a filing is still required, and operating beyond scope is punished the same as having no license.","why":"Operating beyond the scope of a license you hold is punished the same as having no license; 'the developer said it's not needed' is not a compliance basis."},{"topic":"Founder assets","title":"Have you signed a personal joint-and-several guarantee?","desc":"You signed a personal joint-and-several guarantee for a company loan, or used your family home as collateral.","opts":["No, family assets and the company are completely separate","Yes, but the bank said it was just a formality","Yes, but it should be a simple guarantee, right?"],"rule":"In a guarantee, look for the words 'joint and several': don't sign if you can avoid it; if you must, sign only a simple guarantee, state a clear cap, and keep it within an amount you can afford to lose.","why":"Joint-and-several liability means that if the company can't repay, your house and savings can be seized directly."},{"topic":"Founder assets","title":"Has company money ever gone into your personal card?","desc":"You mix personal and company accounts, occasionally route payments through a personal card, or set a very high registered capital.","opts":["No, personal and company accounts are strictly separate","I've occasionally used a personal card for cash flow","Always done it that way, it's convenient"],"rule":"Choosing the right entity is only a starting point: keep personal and company accounts separate, don't let payments go into personal cards, and don't inflate registered capital — otherwise 'limited' liability can be voided through mixing of personalities or accelerated capital calls.","why":"Once the accounts are mixed, the 'limited liability' firewall can be pierced directly by an enforcement court."},{"topic":"Founder assets","title":"If you lost all this money, what would happen to your life?","desc":"If not a cent of the invested money remained, would it affect your mortgage, raising your children, or medical care?","opts":["Losing it all wouldn't affect my basic living","It would be tight, but I could get through","I borrowed money, or used my family's money"],"rule":"First set the amount that, even if fully lost, wouldn't affect your mortgage, child-rearing, or medical care; don't count family money or borrowed money, and if it exceeds that amount, don't invest.","why":"The amount you can afford to lose should be fixed in advance, not questioned halfway through the loss."},{"topic":"Tech red lines","title":"Before taking on that side gig, what did you ask first?","desc":"For jobs like scrapers, scripts, cheats, or ticket-grabbing tools, what was the first question in your mind before you started?","opts":["First ask 'will the other party report it?', then decide whether to do it","First see whether it's technically feasible","Everyone's doing it, so it should be fine"],"rule":"Before you start, don't ask 'can it be done technically?' — ask 'will the vendor, platform, or company report it?' Logs can be retrieved; 'nobody cares' is an illusion.","why":"Technical feasibility doesn't mean legal permissibility; backend logs are retained and can be fully retrieved afterwards."},{"topic":"Tech red lines","title":"Do you still have things from your previous employer?","desc":"Source code, customer lists, system accounts — you kept them after leaving, and even log in occasionally to look.","opts":["I handed everything over and had the access revoked","I kept some material as a reference","I still have the account and log in occasionally"],"rule":"On leaving, hand over all access; don't delete the database, leave a backdoor, or take source code: account authorization ends with departure, unpaid wages go to arbitration, and code and customer lists belong to the company.","why":"After leaving, account authorization ends automatically; logging in again is no longer 'viewing' but unauthorized access."},{"topic":"Criminal risk","title":"Has anyone borrowed your card or verification code?","desc":"Lending your bank card, account, or verification code to others, or helping someone 'face-scan' to get a loan or act as a witness.","opts":["Never, I never lend them to anyone","I once received money for a friend","I did a face-scan as a witness, that's not a loan, is it?"],"rule":"Never lend your card, account, or verification code: lending itself is illegal; 'unawareness' is inferred from kickbacks and abnormal transactions, and knowingly doing so constitutes the crime of assisting information-network crime.","why":"At the moment you face-scan or sign, you become the borrower; even if the broker is convicted, your debt is not waived."},{"topic":"Legal remedies","title":"If you're actually summoned, do you know the first step?","desc":"When summoned or criminally detained, what to do at the first interrogation, and what the 37-day window is.","opts":["Clear: request a lawyer on the spot, read the transcript word by word, 37 days is the arrest-approval window","I know I need a lawyer, but not when to get one","No idea, I figured I'd just cooperate"],"rule":"If summoned or criminally detained: request a lawyer at the first interrogation, read the entire transcript word by word before signing, don't settle privately, delete records, or confess to things you didn't do; miss the 37-day arrest-approval window and it's gone.","why":"Once a transcript is signed, it's very hard to overturn; the 37 days are the key window to seek non-approval of arrest, and missing it leaves you passive."},{"topic":"Evidence","title":"How do you write data you can't verify?","desc":"When writing a proposal or report, you encounter a law, figure, or case you can't verify.","opts":["Explicitly write 'not verifiable', don't invent figures","Find a roughly similar source and patch it in","It's AI-generated, it should be about right"],"rule":"If there's no official data you can verify word for word, write 'not verifiable' explicitly; don't invent figures or cases; when citing, check the original word for word and cross-verify.","why":"A single invented figure zeroes out the credibility of the whole document — this is the book's bottom line of evidentiary integrity."}]},"fr":{"ui":{"pageTitle":"Bilan de conformité pour fondateurs · Les 3 choses à faire en premier","brandName":"Gardien de la conformité des fondateurs","brandSource":"D'après Le Guide de vie rentable","brandMark":"C","introH1":"Vous pensez que tout va bien,<br>mais vous <em>frôlez les lignes rouges<\/em>.","introLede":"10 questions pour soumettre vos actions de fondateur à un <strong>bilan de conformité<\/strong>.<br>Les réponses vous diront : <strong>les 3 choses à faire en premier maintenant<\/strong>, et pourquoi.","feat1":"<b>Uniquement des actions concrètes<\/b> — comment vous encaissez, comment vous obtenez vos autorisations, si vous avez signé une garantie ; pas de grands discours.","feat2":"<b>Classé par risque<\/b> — traitez d'abord le plus critique, au lieu d'énumérer une liste de « vous devez faire attention à tout ».","feat3":"<b>Chaque réponse a une source<\/b> — les réponses proviennent de 44 fiches de prévention vérifiées, avec les sections d'origine citées.","startBtn":"Commencer le bilan · environ 2 minutes","fineIntro":"Générez une image de votre résultat à enregistrer et partager · Entièrement gratuit · Aucune donnée collectée","qCount":"Question <b>{n}<\/b> / 10","qBack":"← Précédent","vLab":"R É S U L T A T","secTitle":"Les 3 choses que vous devriez faire en premier maintenant","shareTitle":"Générer ma carte de résultat","shareDesc":"Appuyez longuement sur l'image pour l'enregistrer, puis partagez dans un groupe / sur Moments<br>Faites aussi tester vos cofondateurs","genBtn":"Générer l'image à partager","resultAlt":"Carte de résultat du bilan, appuyez longuement pour enregistrer","saveTip":"↑ Appuyez longuement sur l'image ci-dessus → Enregistrez dans l'album → Partagez","restartBtn":"Refaire le test","fineResult":"D'après Le Guide de vie rentable (CC BY 4.0) · Distillation verticale · Date de synchronisation : 2026-11-16<br>Cet outil est une auto-évaluation générale et ne remplace pas l'avis professionnel des avocats, médecins ou comptables ; les points relatifs aux politiques suivent le texte officiel en vigueur.","cardHead":"B I L A N   D E   C O N F O R M I T É   D E S   F O N D A T E U R S","cardTitle":"Vos","cardTail":"actions","cardScore":"Score de risque","cardRank":"Priorité","cardSource":"Source","cardFooter1":"Les 44 fiches de prévention complètes","cardFooter2":"Scannez pour suivre « Wo AI Nin » · Tout le contenu est gratuit","cardQr":"Code QR","cardLicense":"D'après Le Guide de vie rentable · CC BY 4.0 · Sync. 2026-11-16","toastSaved":"Généré — appuyez longuement sur l'image pour enregistrer","note":"Remarque : la formulation juridique est conforme au texte chinois original."},"grades":["Risque faible","Risque moyen","Risque élevé"],"descs":["Vos défenses de base sont intactes. Continuez ainsi et prêtez attention aux points de renforcement ci-dessous.","Il y a quelques points faibles, et au moins l'un d'eux pourrait coûter cher en cas de problème. Corrigez-les dans l'ordre ci-dessous.","Plusieurs lignes rouges se sont allumées en même temps. Ne cherchez pas à tout corriger d'un coup : commencez par la toute première."],"qs":[{"topic":"Plateforme","title":"Sur quel compte l'argent de l'acheteur arrive-t-il en premier ?","desc":"Après le paiement de l'utilisateur, l'argent arrive d'abord sur le propre compte de la plateforme, puis vous le retirez ou le transférez au vendeur.","opts":["L'argent est réglé directement au vendeur ; la plateforme ne prélève que des frais de service","Il arrive d'abord sur le compte de la plateforme, puis je le transfère au vendeur","Je l'encaisse via mon WeChat ou ma carte bancaire personnelle"],"rule":"L'argent ne doit pas entrer sur le propre compte de la plateforme : utilisez un établissement agréé pour le partage des fonds, réglez directement le vendeur, et laissez la plateforme ne prélever que des frais de service.","why":"Lorsque l'argent passe par le compte de la plateforme avant d'être transféré, cela risque d'être considéré comme une activité de paiement exercée sans licence (communément appelée « double compensation »)."},{"topic":"Plateforme","title":"Avant le lancement, avez-vous confirmé quelles autorisations vous deviez obtenir ?","desc":"Avez-vous vérifié point par point, avant le lancement, les licences et déclarations requises pour votre site web, application ou mini-programme ?","opts":["J'ai qualifié chaque activité et effectué toutes les licences et déclarations requises","Lancer d'abord, on verra si quelqu'un vérifie","J'ai demandé au développeur, qui a dit qu'aucune autorisation n'était nécessaire"],"rule":"Qualifiez d'abord selon « rentrée d'argent + accueil de tiers + type d'activité » avant de vérifier les licences ; même exempt de licence, une déclaration reste requise, et dépasser le périmètre est puni comme l'absence de licence.","why":"Exercer au-delà du périmètre d'une licence détenue est puni comme l'absence de licence ; « le développeur a dit que ce n'était pas nécessaire » n'est pas une base de conformité."},{"topic":"Patrimoine","title":"Avez-vous signé une garantie personnelle conjointe et solidaire ?","desc":"Vous avez signé une garantie conjointe et solidaire pour un prêt de la société, ou hypothéqué le domicile familial.","opts":["Non, le patrimoine familial et la société sont complètement séparés","Oui, mais la banque a dit que ce n'était qu'une formalité","Oui, mais c'est sûrement une garantie simple, non ?"],"rule":"Dans une garantie, recherchez les termes « conjointe et solidaire » : ne signez pas si vous pouvez l'éviter ; sinon, signez uniquement une garantie simple, indiquez un plafond clair et restez dans un montant que vous pouvez vous permettre de perdre.","why":"La responsabilité conjointe et solidaire signifie que, si la société ne peut rembourser, votre logement et vos économies peuvent être saisis directement."},{"topic":"Patrimoine","title":"L'argent de la société est-il déjà passé sur votre carte personnelle ?","desc":"Vous mélangez comptes personnels et professionnels, faites parfois passer des paiements par une carte personnelle, ou fixez un capital social très élevé.","opts":["Non, les comptes personnels et professionnels sont strictement séparés","J'ai parfois utilisé une carte personnelle pour des besoins de trésorerie","J'ai toujours fait comme ça, c'est pratique"],"rule":"Choisir la bonne forme juridique n'est qu'un préalable : séparez les comptes, ne faites pas entrer les paiements sur des cartes personnelles et ne gonflez pas le capital social — sinon la responsabilité « limitée » peut être écartée pour confusion de personnalités ou exigibilité anticipée des apports.","why":"Dès que les comptes sont mélangés, le « pare-feu » de la responsabilité limitée peut être directement percé par le tribunal d'exécution."},{"topic":"Patrimoine","title":"Si vous perdiez tout cet argent, qu'arriverait-il à votre vie ?","desc":"S'il ne restait pas un centime de l'argent investi, cela affecterait-il votre prêt hypothécaire, l'éducation de vos enfants ou vos soins médicaux ?","opts":["Tout perdre n'affecterait pas mon niveau de vie de base","Ce serait serré, mais je pourrais m'en sortir","J'ai emprunté de l'argent, ou utilisé celui de ma famille"],"rule":"Fixez d'abord le montant qui, même entièrement perdu, n'affecterait pas votre prêt hypothécaire, l'éducation de vos enfants ou vos soins ; n'y incluez ni l'argent familial ni l'argent emprunté, et si le montant dépasse ce seuil, n'investissez pas.","why":"Le montant que vous pouvez vous permettre de perdre doit être fixé à l'avance, et non remis en question à mi-parcours."},{"topic":"Lignes rouges tech","title":"Avant de vous lancer dans cette activité secondaire, qu'avez-vous demandé en premier ?","desc":"Pour des travaux comme les robots d'exploration, scripts, logiciels de triche ou outils d'achat de billets, quelle a été votre première question avant de commencer ?","opts":["Demandez d'abord « est-ce que la partie adverse portera plainte ? », puis décidez","Vérifiez d'abord si c'est techniquement réalisable","Tout le monde le fait, donc ça doit passer"],"rule":"Avant de commencer, ne demandez pas « est-ce techniquement faisable ? » — demandez « le fournisseur, la plateforme ou l'entreprise porteront-ils plainte ? » Les journaux peuvent être récupérés ; « personne ne s'en occupe » est une illusion.","why":"Faisable techniquement ne veut pas dire autorisé par la loi ; les journaux du serveur sont conservés et peuvent être entièrement récupérés après coup."},{"topic":"Lignes rouges tech","title":"Gardez-vous encore des éléments de votre ancien employeur ?","desc":"Code source, listes de clients, comptes système — vous les avez conservés après votre départ et vous y connectez même parfois pour regarder.","opts":["J'ai tout rendu et fait révoquer les accès","J'ai gardé quelques documents comme référence","J'ai encore le compte et je me connecte de temps en temps"],"rule":"À votre départ, remettez tous les accès : ne supprimez pas la base, ne laissez pas de porte dérobée et n'emportez pas de code source. L'autorisation des comptes prend fin avec le départ, les salaires impayés passent par l'arbitrage, et le code ainsi que les listes de clients appartiennent à l'entreprise.","why":"Après le départ, l'autorisation du compte prend fin automatiquement ; se reconnecter n'est plus de la « consultation » mais un accès non autorisé."},{"topic":"Risque pénal","title":"Quelqu'un a-t-il emprunté votre carte ou votre code de vérification ?","desc":"Prêter votre carte bancaire, votre compte ou votre code de vérification, ou aider quelqu'un à « scanner son visage » pour obtenir un prêt ou servir de témoin.","opts":["Jamais, je ne les prête à personne","J'ai déjà reçu de l'argent pour un ami","J'ai fait un scan facial comme témoin, ce n'est pas un prêt, si ?"],"rule":"Ne prêtez jamais votre carte, compte ou code de vérification : le prêt lui-même est illégal ; « l'ignorance » est déduite des pots-de-vin et des flux anormaux, et le faire sciemment constitue le délit d'aide aux activités criminelles en réseau.","why":"Au moment où vous scannez votre visage ou signez, vous devenez l'emprunteur ; même si l'intermédiaire est condamné, votre dette n'est pas effacée."},{"topic":"Recours juridiques","title":"Si vous êtes réellement convoqué, connaissez-vous la première étape ?","desc":"En cas de convocation ou de détention provisoire, que faire lors du premier interrogatoire, et que représente le délai de 37 jours.","opts":["Clair : demander un avocat sur-le-champ, lire le procès-verbal mot pour mot, 37 jours est le délai d'approbation de l'arrestation","Je sais qu'il faut un avocat, mais pas quand le demander","Aucune idée, je pensais qu'il suffisait de coopérer"],"rule":"En cas de convocation ou de détention : demandez un avocat dès le premier interrogatoire, lisez tout le procès-verbal mot pour mot avant de signer, ne réglez pas à l'amiable, ne supprimez pas d'enregistrements et n'avouez pas ce que vous n'avez pas fait ; rater le délai de 37 jours d'approbation de l'arrestation, c'est le perdre.","why":"Une fois le procès-verbal signé, il est très difficile de le renverser ; les 37 jours sont le délai clé pour éviter l'arrestation, et le manquer vous laisse dans une position passive."},{"topic":"Preuves","title":"Comment rédigez-vous des données que vous ne pouvez pas vérifier ?","desc":"En rédigeant une proposition ou un rapport, vous rencontrez une loi, un chiffre ou un cas que vous ne pouvez pas vérifier.","opts":["Indiquez explicitement « non vérifiable », n'inventez pas de chiffres","Trouvez une source à peu près similaire et l'utilisez","C'est généré par IA, ça doit être à peu près juste"],"rule":"S'il n'existe pas de données officielles vérifiables mot pour mot, indiquez explicitement « non vérifiable » ; n'inventez ni chiffres ni cas ; pour les citations, vérifiez le texte original mot pour mot et recoupez les sources.","why":"Un seul chiffre inventé ramène à zéro la crédibilité de tout le document — c'est le principe fondamental de l'ouvrage en matière d'intégrité des preuves."}]},"ru":{"ui":{"pageTitle":"Проверка соответствия для предпринимателей · 3 дела, которые нужно сделать первыми","brandName":"Инспектор соответствия для предпринимателей","brandSource":"По книге «Руководство по выгодной жизни»","brandMark":"C","introH1":"Вы думаете, что всё в порядке,<br>а на деле уже <em>переступаете красную линию<\/em>.","introLede":"10 вопросов — и <strong>проверка соответствия<\/strong> ваших предпринимательских действий.<br>В конце вы узнаете: <strong>3 дела, которые нужно сделать прямо сейчас<\/strong>, и почему.","feat1":"<b>Только реальные действия<\/b> — как вы получаете деньги, какие разрешения оформляете, подписывали ли гарантию; никаких общих слов.","feat2":"<b>По уровню риска<\/b> — сначала устраняем самое опасное, а не просто перечисляем «обратите внимание на всё».","feat3":"<b>Каждый ответ со ссылкой<\/b> — ответы из 44 проверенных карт ловушек с указанием раздела и пункта оригинала.","startBtn":"Начать проверку · около 2 минут","fineIntro":"Результат можно сохранить как изображение и поделиться им · полностью бесплатно · мы не собираем никаких данных","qCount":"Вопрос <b>{n}<\/b> из 10","qBack":"← Назад","vLab":"Р Е З У Л Ь Т А Т","secTitle":"3 дела, которые вам стоит сделать прямо сейчас","shareTitle":"Создать мою карту результатов","shareDesc":"Нажмите и удерживайте изображение, чтобы сохранить его в галерею, и отправьте в чат WeChat / «Моменты»<br>Пусть и ваши коллеги по бизнесу пройдут проверку","genBtn":"Создать изображение для публикации","resultAlt":"Карта результатов проверки, нажмите и удерживайте для сохранения","saveTip":"↑ Нажмите и удерживайте изображение выше → сохраните в галерею → отправьте","restartBtn":"Пройти ещё раз","fineResult":"По книге «Руководство по выгодной жизни» (CC BY 4.0) · вертикальная дистилляция · дата синхронизации 2026-11-16<br>Этот инструмент служит для общей самопроверки и не заменяет профессиональную оценку юриста, врача или бухгалтера; пункты, касающиеся политики, приводятся по действующему официальному тексту.","cardHead":"П Р О В Е Р К А   С О О Т В Е Т С Т В И Я","cardTitle":"Ваши главные","cardTail":"дела","cardScore":"Баллы риска","cardRank":"Приоритет","cardSource":"Источник","cardFooter1":"Полный набор из 44 карт ловушек","cardFooter2":"Отсканируйте, чтобы подписаться на «Wo AI Nin» · Весь контент бесплатен","cardQr":"QR-код","cardLicense":"По «Руководству по выгодной жизни» · CC BY 4.0 · Синхронизировано 2026-11-16","toastSaved":"Готово — нажмите и удерживайте изображение, чтобы сохранить","note":"Примечание: юридические формулировки приведены по китайскому оригиналу."},"grades":["Низкий риск","Средний риск","Высокий риск"],"descs":["Ваша основная защита выстроена. Сохраняйте её и обратите внимание на пункты ниже для усиления.","Есть несколько слабых мест, и хотя бы одно из них может дорого обойтись. Восполняйте пробелы в порядке, указанном ниже.","Сразу загорелись несколько красных линий. Не пытайтесь исправить всё за один раз — начните с самого первого пункта."],"qs":[{"topic":"Платформа","title":"Куда сначала приходят деньги покупателя?","desc":"После оплаты пользователем деньги сначала попадают на собственный счёт платформы, а затем вы выводите их или переводите продавцу.","opts":["Деньги сразу идут продавцу, платформа берёт только комиссию за услуги","Сначала на счёт платформы, потом я перевожу продавцу","Принимаю на личный WeChat или банковскую карту"],"rule":"Деньги не должны поступать на собственный счёт платформы: используйте разделение платежей через лицензированную организацию, деньги сразу идут продавцу, а платформа берёт только комиссию за услуги.","why":"Если деньги проходят через счёт платформы и затем выводятся, это легко расценить как осуществление платёжной деятельности без лицензии (так называемая «вторичная очистка»)."},{"topic":"Платформа","title":"Перед запуском вы проверяли, какие разрешения нужны?","desc":"Лицензии и регистрации, необходимые для сайта, приложения или мини-программы, вы сверили по пунктам перед запуском.","opts":["Определил вид деятельности по пунктам и оформил все нужные лицензии и регистрации","Сначала запущу, а разберёмся, когда начнут проверять","Спросил программиста — он сказал, что не нужно"],"rule":"Сначала определите вид деятельности по схеме «берём ли деньги + пускаем ли третьих лиц + чем занимаемся», затем сверяйте разрешения; даже при освобождении от лицензии нужна регистрация, а выход за рамки разрешения наказывается так же, как отсутствие лицензии.","why":"Лицензия есть, но деятельность выходит за её рамки — штраф тот же, что и без лицензии; «программист сказал, что не нужно» не является основанием для соответствия."},{"topic":"Активы основателя","title":"Вы подписывали личную солидарную гарантию?","desc":"Вы подписали личную солидарную гарантию по кредиту компании или заложили семейное жильё.","opts":["Нет, семейные активы и компания полностью разделены","Подписал, банк сказал, что это просто формальность","Подписал, но, кажется, это простая гарантия, разве нет?"],"rule":"В гарантийном письме смотрите на слово «солидарная»: если можно не подписывать — не подписывайте; если неизбежно, подписывайте только простую гарантию, чётко укажите предел и уложитесь в сумму, которую можете потерять.","why":"Солидарная ответственность означает, что если компания не вернёт долг, ваша квартира и счета будут взысканы напрямую."},{"topic":"Активы основателя","title":"Деньги компании когда-либо поступали на вашу личную карту?","desc":"Личные и деловые счета смешаны, выручка иногда идёт через личную карту или уставный капитал указан слишком большим.","opts":["Нет, личные и деловые счета строго разделены","Изредка использовал личную карту для оборота","Так делаю постоянно — так удобнее"],"rule":"Правильный выбор формы — лишь начало: разделяйте счета, не пропускайте выручку через личную карту и не завышайте уставный капитал, иначе «ограниченная» ответственность перестанет действовать из-за смешения личностей или ускоренного погашения взносов.","why":"Стоит смешать счета — и «ограниченная ответственность», этот защитный барьер, может быть напрямую пробит судом при взыскании."},{"topic":"Активы основателя","title":"Если потерять все эти деньги, что изменится в жизни?","desc":"Если вложенные деньги исчезнут до последней копейки, пострадают ли ипотека, содержание детей или лечение.","opts":["Даже полная потеря не затронет основной уровень жизни","Будет туговато, но выдержу","Деньги заняты или использованы семейные сбережения"],"rule":"Сначала определите сумму, которую можно потерять полностью без ущерба для ипотеки, содержания детей и лечения; деньги семьи и заёмные средства не учитывайте, а если сумма выше — не инвестируйте.","why":"Сумму, которую вы можете позволить себе потерять, нужно рассчитать заранее, а не спрашивать себя на полпути, смиритесь ли вы с убытком."},{"topic":"Технические красные линии","title":"Что вы спросили себя перед тем, как взяться за тот побочный заработок?","desc":"Парсеры, скрипты, читы, программы для скупки билетов — первая мысль в голове перед тем, как начать такую работу.","opts":["Сначала спросить: «Подаст ли другая сторона заявление в полицию?» — и только потом решать","Сначала посмотреть, получится ли это технически","Все так делают — наверное, ничего страшного"],"rule":"Перед началом спрашивайте не «можно ли это сделать технически», а «подадут ли разработчик, платформа или компания заявление» — журналы можно истребовать, а «никто не следит» — самообман.","why":"Техническая возможность не означает юридическую разрешённость; серверные журналы сохраняются и позже могут быть полностью истребованы."},{"topic":"Технические красные линии","title":"Вещи бывшего работодателя всё ещё у вас?","desc":"Исходный код, список клиентов, учётные записи системы — после увольнения вы всё это сохранили и даже иногда заходите посмотреть.","opts":["Всё передал, доступы отозваны","Оставил немного материалов для справки","Аккаунт остался, иногда захожу посмотреть"],"rule":"При увольнении передайте все доступы, не удаляйте базу, не оставляйте лазеек и не уносите исходный код: полномочия на аккаунт прекращаются с увольнением, задолженность по зарплате — через арбитраж, а код и список клиентов принадлежат компании.","why":"После увольнения авторизация аккаунта прекращается автоматически, и повторный вход — это уже не «просмотр», а несанкционированный доступ."},{"topic":"Уголовный риск","title":"Просили у вас карту или код подтверждения?","desc":"Вы давали другим банковскую карту, аккаунт или код подтверждения, либо помогали оформить кредит по биометрии («сканирование лица») или выступить свидетелем.","opts":["Никогда — ничего не даю в долг","Один раз получил деньги за друга","Проходил распознавание лица как свидетель — это же не кредит"],"rule":"Карту, счёт и код подтверждения не передавайте никому: сама передача незаконна; «не знал» выводится из вознаграждения и аномальных операций, а при осознании наступает уголовная ответственность за пособничество информационно-сетевому преступлению.","why":"В момент распознавания лица или подписи заёмщиком становитесь вы; даже если посредника осудят, ваш долг это не отменит."},{"topic":"Правовые меры","title":"Если вас действительно вызовут на допрос, знаете ли вы первый шаг?","desc":"При вызове на допрос или задержании: что делать на первом допросе и что собой представляет окно в 37 дней.","opts":["Знаю: сразу пригласить адвоката, протокол прочитать слово в слово, 37 дней — это окно для санкции на арест","Знаю, что нужен адвокат, но не знаю, когда именно его позвать","Совсем не знаю — думаю, достаточно сотрудничать"],"rule":"При вызове или задержании: пригласите адвоката уже на первом допросе, прочитайте протокол слово в слово перед подписью, не договаривайтесь по-тихому, не удаляйте записи и не признавайтесь в том, чего не делали; окно в 37 дней для санкции на арест, если его упустить, не вернётся.","why":"Подписанный протокол очень трудно опровергнуть; 37 дней — ключевое окно, чтобы добиться отказа в аресте; упустите его — и окажетесь в пассивной позиции."},{"topic":"Доказательства","title":"Как вы пишете, если данные не находятся?","desc":"При подготовке плана или отчёта вы сталкиваетесь с законом, цифрой или делом, которые нельзя проверить.","opts":["Честно написать «не найдено», не выдумывать цифры","Подобрать похожий источник, лишь бы подошёл","Сгенерировано ИИ — наверное, сойдёт"],"rule":"Если нет официальных данных, которые можно сверить слово в слово, честно напишите «не найдено», не выдумывайте цифры и дела; цитаты сверяйте с оригиналом дословно и перепроверяйте их.","why":"Одна выдуманная цифра обнуляет доверие ко всему документу — это нижняя граница доказательной честности во всей книге."}]},"es":{"ui":{"pageTitle":"Revisión de cumplimiento para emprendedores · Las 3 cosas que hay que hacer primero","brandName":"Guardián del cumplimiento para emprendedores","brandSource":"De la «Guía de vida rentable»","brandMark":"C","introH1":"Crees que todo está bien,<br>pero en realidad ya estás <em>cruzando una línea roja<\/em>.","introLede":"10 preguntas para someter tus acciones como emprendedor a una <strong>revisión de cumplimiento<\/strong>.<br>Al terminar sabrás: <strong>las 3 cosas que debes hacer ahora mismo<\/strong>, y por qué.","feat1":"<b>Solo acciones reales<\/b>: cómo cobras, qué autoridades tramitas, si firmaste una garantía; nada de grandes discursos.","feat2":"<b>Ordenado por riesgo<\/b>: primero lo más urgente, en lugar de una lista de «tienes que vigilarlo todo».","feat3":"<b>Cada respuesta con su fuente<\/b>: las respuestas proceden de 44 fichas de prevención verificadas, con sección y artículo del original.","startBtn":"Empezar la revisión · unos 2 minutos","fineIntro":"Puedes generar una imagen del resultado para guardarla y compartirla · totalmente gratis · no recopilamos ningún dato","qCount":"Pregunta <b>{n}<\/b> de 10","qBack":"← Anterior","vLab":"R E S U L T A D O","secTitle":"Las 3 cosas que deberías hacer ahora mismo","shareTitle":"Generar mi tarjeta de resultados","shareDesc":"Mantén pulsada la imagen para guardarla en la galería y compártela en un grupo de WeChat / «Momentos»<br>Que también se revisen quienes emprenden contigo","genBtn":"Generar la imagen para compartir","resultAlt":"Tarjeta de resultados de la revisión, mantén pulsada para guardar","saveTip":"↑ Mantén pulsada la imagen de arriba → guárdala en la galería → compártela","restartBtn":"Hacerlo de nuevo","fineResult":"De la «Guía de vida rentable» (CC BY 4.0) · destilación vertical · fecha de sincronización: 2026-11-16<br>Esta herramienta es una autocomprobación general y no sustituye el juicio profesional de abogados, médicos o contadores; las cuestiones de carácter normativo se rigen por el texto oficial vigente.","cardHead":"R E V I S I Ó N   D E   C U M P L I M I E N T O","cardTitle":"Tus principales","cardTail":"acciones","cardScore":"Puntuación de riesgo","cardRank":"Prioridad","cardSource":"Fuente","cardFooter1":"Las 44 fichas de prevención completas","cardFooter2":"Escanea para seguir «Wo AI Nin» · Todo el contenido es gratuito","cardQr":"Código QR","cardLicense":"De la «Guía de vida rentable» · CC BY 4.0 · Sincronizado 2026-11-16","toastSaved":"Generado: mantén pulsada la imagen para guardarla","note":"Nota: las formulaciones legales se rigen por el texto original chino."},"grades":["Riesgo bajo","Riesgo medio","Riesgo alto"],"descs":["Tus defensas básicas están intactas. Manténlas y ten en cuenta los puntos de refuerzo que aparecen a continuación.","Hay algunos puntos débiles y al menos uno de ellos puede salir caro. Corrígelos en el orden indicado más abajo.","Varias líneas rojas se encienden a la vez. No intentes cambiarlo todo de una: empieza por la primera de la lista."],"qs":[{"topic":"Plataforma","title":"¿En qué cuenta entra primero el dinero del comprador?","desc":"Tras el pago del usuario, el dinero entra primero en la propia cuenta de la plataforma y después lo retiras o lo transfieres al vendedor.","opts":["El dinero se liquida directamente al vendedor; la plataforma solo cobra una comisión por el servicio","Primero entra en la cuenta de la plataforma y luego lo transfiero al vendedor","Lo cobro en mi WeChat personal o en mi tarjeta bancaria"],"rule":"El dinero no debe entrar en la propia cuenta de la plataforma: utiliza el reparto de fondos a través de una entidad con licencia, liquida directamente al vendedor y deja que la plataforma cobre solo una comisión por el servicio.","why":"Si el dinero pasa por la cuenta de la plataforma antes de transferirse, fácilmente se interpreta como una actividad de pago ejercida sin licencia (lo que se conoce como «segunda compensación»)."},{"topic":"Plataforma","title":"¿Antes del lanzamiento confirmaste qué autorizaciones necesitabas?","desc":"Las licencias y los registros necesarios para un sitio web, una aplicación o un mini-programa los revisaste punto por punto antes del lanzamiento.","opts":["Clasifiqué cada actividad y tramité todas las licencias y registros necesarios","Lanzo primero y ya veremos cuando vengan a revisar","Se lo pregunté al programador y dijo que no hacía falta"],"rule":"Clasifica primero según «¿entra dinero? + ¿se admite a terceros? + qué actividad se realiza» y después revisa las licencias; incluso si no se requiere licencia hace falta el registro, y operar fuera del ámbito autorizado se castiga igual que no tener licencia.","why":"Operar fuera del ámbito de una licencia que se tiene se castiga igual que no tenerla; «el programador dijo que no hacía falta» no es una base de cumplimiento."},{"topic":"Patrimonio","title":"¿Has firmado una garantía personal conjunta y solidaria?","desc":"Firmaste una garantía conjunta y solidaria para el préstamo de la empresa o hipotecaste la vivienda familiar.","opts":["No, el patrimonio familiar y la empresa están completamente separados","Sí, pero el banco dijo que era solo un trámite","Sí, pero supongo que es una garantía simple, ¿no?"],"rule":"En la carta de garantía fíjate en los términos «conjunta y solidaria»: si puedes no firmar, no firmes; si es inevitable, firma solo una garantía simple, indica un límite claro y mantente dentro del importe que puedes permitirte perder.","why":"La responsabilidad conjunta y solidaria significa que, si la empresa no puede pagar, tu vivienda y tus ahorros pueden ser embargados directamente."},{"topic":"Patrimonio","title":"¿Ha entrado alguna vez dinero de la empresa en tu tarjeta personal?","desc":"Mezclas las cuentas personales y de la empresa, haces pasar a veces los cobros por una tarjeta personal o fijas un capital social muy alto.","opts":["No, las cuentas personales y de la empresa están estrictamente separadas","De vez en cuando usé la tarjeta personal para movimientos de efectivo","Siempre lo he hecho así, es más cómodo"],"rule":"Elegir la forma jurídica correcta es solo el punto de partida: separa las cuentas, no hagas pasar los cobros por tarjetas personales y no inflas el capital social; si no, la responsabilidad «limitada» deja de aplicarse por confusión de patrimonios o por exigibilidad anticipada de las aportaciones.","why":"En cuanto se mezclan las cuentas, el «cortafuegos» de la responsabilidad limitada puede ser atravesado directamente por el tribunal de ejecución."},{"topic":"Patrimonio","title":"Si perdieras todo ese dinero, ¿qué pasaría con tu vida?","desc":"Si no quedara ni un céntimo del dinero invertido, ¿afectaría a la hipoteca, a la manutención de tus hijos o a la atención médica?","opts":["Perderlo todo no afectaría a mi nivel de vida básico","Iría un poco justo, pero podría salir adelante","He pedido prestado o he usado dinero de mi familia"],"rule":"Fija primero el importe que, incluso perdiéndolo por completo, no afectaría a la hipoteca, a la manutención de los hijos ni a la atención médica; no incluyas el dinero familiar ni el prestado, y si se supera esa cifra, no inviertas.","why":"La cifra que puedes permitirte perder debe fijarse por adelantado, no ponerse en duda a mitad de camino."},{"topic":"Líneas rojas técnicas","title":"Antes de lanzarte a ese trabajo secundario, ¿qué preguntaste primero?","desc":"Para trabajos como rastreadores, scripts, trampas o herramientas para comprar entradas, ¿cuál fue la primera pregunta que te vino a la mente antes de empezar?","opts":["Preguntar primero «¿denunciará la otra parte?», y después decidir","Ver primero si técnicamente se puede hacer","Todo el mundo lo hace; supongo que no habrá problema"],"rule":"Antes de empezar no te preguntes «¿se puede hacer técnicamente?», sino «¿denunciarán el proveedor, la plataforma o la empresa?»: los registros pueden solicitarse, y «nadie se entera» es un engaño.","why":"Que sea técnicamente posible no significa que sea legal; los registros del servidor se conservan y después pueden reclamarse por completo."},{"topic":"Líneas rojas técnicas","title":"¿Sigues teniendo cosas de tu anterior empleador?","desc":"Código fuente, listas de clientes, cuentas del sistema: después de dejar el empleo las conservas e incluso entras de vez en cuando a mirar.","opts":["Lo entregué todo y cancelé los accesos","Guardé algunos materiales como referencia","Conservo la cuenta y entro de vez en cuando a mirar"],"rule":"Al salir, entrega todos los accesos, no borres la base de datos, no dejes puertas traseras ni te lleves el código fuente: la autorización de la cuenta termina con la salida, los salarios impagados se reclaman por arbitraje y el código y la lista de clientes pertenecen a la empresa.","why":"Tras dejar la empresa, la autorización de la cuenta se termina automáticamente y volver a entrar ya no es «mirar», sino un acceso no autorizado."},{"topic":"Riesgo penal","title":"¿Te han pedido alguna vez tu tarjeta o un código de verificación?","desc":"Prestar a otros tu tarjeta bancaria, tu cuenta o tu código de verificación, o ayudar a alguien a obtener un préstamo con «reconocimiento facial» o a actuar como testigo.","opts":["Nunca; no se los presto a nadie","Una vez cobré dinero para un amigo","Hice el reconocimiento facial como testigo; eso no es un préstamo, ¿verdad?"],"rule":"No prestes jamás la tarjeta, la cuenta ni el código de verificación: cederlos ya es ilegal; «no lo sabía» se deduce de las comisiones y de los movimientos anómalos, y hacerlo a sabiendas constituye el delito de auxilio a la criminalidad informática.","why":"En el momento del reconocimiento facial o de la firma, el prestatario eres tú; aunque condenen al intermediario, tu deuda no desaparece."},{"topic":"Recursos legales","title":"Si te citan realmente a declarar, ¿conoces el primer paso?","desc":"Cuando te citan o detienen: qué hacer en el primer interrogatorio y qué es esa ventana de 37 días.","opts":["Lo tengo claro: pedir abogado en el acto, leer el acta palabra por palabra; los 37 días son la ventana para la autorización de la detención","Sé que necesito abogado, pero no sé cuándo pedirlo","No tengo ni idea; suponía que bastaba con cooperar"],"rule":"Si te citan o te detienen: pide abogado ya en el primer interrogatorio, lee el acta entera palabra por palabra antes de firmar, no llegues a acuerdos en privado, no borres registros y no admitas hechos que no cometiste; la ventana de 37 días para la autorización de la detención se pierde si la dejas pasar.","why":"Un acta firmada es muy difícil de echar atrás; los 37 días son la ventana clave para lograr que no se autorice la detención, y si la pierdes quedas en desventaja."},{"topic":"Evidencia","title":"¿Cómo escribes unos datos que no puedes verificar?","desc":"Al preparar un plan o un informe te encuentras con una ley, una cifra o un caso que no puedes comprobar.","opts":["Escribir claramente «no verificable», sin inventar cifras","Buscar una fuente parecida y pegarla","Lo generó la IA; supongo que estará bien"],"rule":"Si no hay datos oficiales que puedas cotejar palabra por palabra, escribe «no verificable» expresamente, no inventes cifras ni casos y, al citar, comprueba el original textualmente y verifica las fuentes entre sí.","why":"Una sola cifra inventada reduce a cero la credibilidad de todo el documento: esa es la línea de base de la integridad probatoria en todo el libro."}]},"pt":{"ui":{"pageTitle":"Verificação de conformidade para empreendedores · As 3 coisas que você deveria fazer primeiro","brandName":"Oficial de Conformidade para Empreendedores","brandSource":"Do livro “Guia de Vida com Boa Relação Custo-Benefício”","brandMark":"C","introH1":"Você acha que está tudo bem,<br>mas na verdade está <em>cruzando linhas vermelhas<\/em>.","introLede":"10 perguntas para fazer uma <strong>verificação de conformidade<\/strong> nas suas ações como empreendedor.<br>Ao final, você descobre: <strong>as 3 coisas que deveria fazer primeiro agora<\/strong>, e por quê.","feat1":"<b>Apenas ações reais<\/b> — como o dinheiro é recebido, como as licenças são obtidas, se garantias foram assinadas; nada de grandes lições gerais.","feat2":"<b>Ordenado por risco<\/b> — primeiro resolva o item mais crítico, em vez de listar um monte de “você deve tomar cuidado com tudo”.","feat3":"<b>Cada item tem sua fonte<\/b> — as respostas vêm de 44 cartões antidarmadilha já verificados, com a seção e o artigo originais indicados.","startBtn":"Começar a verificação · cerca de 2 minutos","fineIntro":"O resultado pode ser salvo e compartilhado como imagem · totalmente gratuito · nenhuma informação é coletada","qCount":"Pergunta <b>{n}<\/b> / 10","qBack":"← Pergunta anterior","vLab":"Resultado da verificação","secTitle":"As 3 coisas que você deveria fazer primeiro agora","shareTitle":"Gere seu cartão de resultado","shareDesc":"Pressione e segure a imagem para salvá-la na galeria e envie para grupos do WeChat / momentos<br>Para que quem está empreendendo com você também faça o teste","genBtn":"Gerar imagem para compartilhar","resultAlt":"Cartão de resultado da verificação, pressione e segure para salvar","saveTip":"↑ Pressione e segure a imagem acima → salve na galeria → compartilhe","restartBtn":"Fazer o teste novamente","fineResult":"Do livro “Guia de Vida com Boa Relação Custo-Benefício” (CC BY 4.0) · destilação vertical · data de sincronização 2026-11-16<br>Esta ferramenta é uma autoanálise geral e não substitui o julgamento profissional de advogados, médicos ou contadores; os itens relacionados a políticas seguem o texto oficial vigente.","cardHead":"Verificação de conformidade para empreendedores","cardTitle":"Suas principais","cardTail":"ações a fazer primeiro","cardScore":"Pontuação de risco","cardRank":"Prioridade","cardSource":"Fonte","cardFooter1":"Todos os 44 cartões antidarmadilha","cardFooter2":"Escaneie o QR code para seguir «我AI您» · todo o conteúdo é gratuito","cardQr":"Código QR","cardLicense":"Do livro “Guia de Vida com Boa Relação Custo-Benefício” CC BY 4.0 · sincronizado em 2026-11-16","toastSaved":"Gerado! Pressione e segure a imagem para salvar","note":"As expressões jurídicas seguem o texto original em chinês."},"grades":["Risco baixo","Risco médio","Risco alto"],"descs":["Sua linha de defesa básica está completa. Mantenha assim e fique atento a estes itens de reforço.","Há algumas falhas, e pelo menos uma delas pode ter um custo alto se algo der errado. Corrija na ordem abaixo.","Várias linhas vermelhas acenderam ao mesmo tempo. Não tente corrigir tudo de uma vez; comece pela primeira coisa da lista."],"qs":[{"topic":"Conformidade da plataforma","title":"Para quem vai o dinheiro do comprador primeiro?","desc":"Depois que o usuário paga, o dinheiro entra primeiro na conta da própria plataforma, e só depois você saca ou transfere ao vendedor.","opts":["O dinheiro é liquidado diretamente ao vendedor, e a plataforma cobra apenas uma taxa de serviço","Entra primeiro na conta da plataforma e depois eu transfiro ao vendedor","Recebo pelo meu WeChat ou cartão bancário pessoal"],"rule":"O dinheiro não entra na conta da própria plataforma: adote o rateamento por instituição licenciada, liquide diretamente ao vendedor e a plataforma receba apenas a taxa de serviço.","why":"Quando o dinheiro passa pela conta da plataforma e depois é transferido, isso tende a ser considerado operação de pagamento sem licença (conhecida como “segunda liquidação”)."},{"topic":"Conformidade da plataforma","title":"Antes do lançamento, você confirmou quais licenças são necessárias?","desc":"Você verificou item por item as licenças e os registros exigidos para o site, o app ou o mini-programa antes de lançá-los.","opts":["Classifiquei cada atividade e obtive as licenças e os registros necessários","Lanço primeiro e vejo se alguém fiscaliza depois","Perguntei ao programador e ele disse que não precisa"],"rule":"Primeiro classifique pelo critério “cobra ou não cobra + permite ou não cadastro de terceiros + que tipo de atividade” e só então verifique as licenças; mesmo dispensado de licença é preciso fazer o registro, e operar fora do escopo é punido como operar sem licença.","why":"Ter a licença, mas operar fora do escopo, é punido da mesma forma que não ter licença; “o programador disse que não precisa” não é fundamento de conformidade."},{"topic":"Bases do empreendedor","title":"Você assinou uma garantia pessoal solidária?","desc":"Você assinou uma garantia pessoal solidária para o empréstimo da empresa, ou usou a casa da família como garantia hipotecária.","opts":["Não; os bens da família estão totalmente separados da empresa","Assinei; o banco disse que era só uma formalidade","Assinei, mas deve ser uma garantia simples, né?"],"rule":"Na carta de garantia, atente à palavra “solidária”: não assine se puder evitar; se for inevitável, assine apenas como garantia simples, com limite claro e dentro do valor que você pode perder.","why":"Responsabilidade solidária significa que, se a empresa não pagar, sua casa e suas economias podem ser executadas diretamente."},{"topic":"Bases do empreendedor","title":"O dinheiro da empresa já entrou no seu cartão pessoal?","desc":"Você mistura contas pessoais e da empresa, às vezes o pagamento de mercadorias passa pelo cartão pessoal, ou o capital social foi registrado muito alto.","opts":["Não; mantenho as contas pessoal e da empresa rigorosamente separadas","Usei o cartão pessoal algumas vezes para adiantar caixa","Sempre faço isso, é mais prático"],"rule":"Escolher a forma societária certa é só o começo: mantenha as contas separadas, não receba pagamentos de mercadorias em conta pessoal e não inflacione o capital social; caso contrário, a “responsabilidade limitada” perde a validade por confusão de personalidades ou por aceleração das cotas subscritas.","why":"Quando as contas se misturam, essa “barreira” da responsabilidade limitada pode ser rompida diretamente pelo tribunal de execução."},{"topic":"Bases do empreendedor","title":"Se esse dinheiro todo se perder, o que acontece com sua vida?","desc":"Se o valor investido não sobrar nada, isso afetará o pagamento da casa, o sustento dos filhos ou o acesso a tratamento médico?","opts":["Mesmo perdendo tudo, minha vida básica não é afetada","Ficaria apertado, mas daria para aguentar","Peguei dinheiro emprestado, ou usei dinheiro da família"],"rule":"Defina primeiro o valor que, mesmo perdido por completo, não afeta a casa, o sustento dos filhos e o tratamento médico; dinheiro da família e dinheiro emprestado não entram na conta; acima disso, não invista.","why":"O valor que você pode perder deve ser calculado de antemão, e não perguntado a si mesmo quando já estiver no meio do prejuízo."},{"topic":"Linhas vermelhas para técnicos","title":"Antes de fazer aquele trabalho paralelo, o que você perguntou primeiro?","desc":"Em trabalhos como raspagem de dados, scripts, cheats ou ferramentas para comprar ingressos, qual era a primeira pergunta na sua cabeça antes de começar?","opts":["Pergunto primeiro se “a outra parte vai registrar ocorrência” e só então decido se faço","Primeiro vejo se é tecnicamente possível fazer","Todo mundo está fazendo, deve estar tudo bem"],"rule":"Antes de agir, não pergunte “é tecnicamente possível?”, pergunte “o fabricante, a plataforma ou a empresa vão registrar ocorrência?” — os logs podem ser recuperados; “ninguém está cuidando” é ilusão.","why":"Viabilidade técnica não significa permissão legal; os logs do servidor ficam retidos e podem ser recuperados por completo depois."},{"topic":"Linhas vermelhas para técnicos","title":"As coisas da sua antiga empresa ainda estão com você?","desc":"Código-fonte, lista de clientes, contas de sistema: você manteve tudo após sair e até entra de vez em quando para dar uma olhada.","opts":["Devolvi tudo e as permissões foram canceladas","Guardei alguns materiais como referência","Ainda tenho a conta e entro de vez em quando"],"rule":"Ao sair, devolva tudo e cancele as permissões: não apague bancos de dados, não deixe portas dos fundos e não leve código-fonte; a autorização da conta termina com a saída, salários devidos vão para arbitragem, e o código e a lista de clientes pertencem à empresa.","why":"Após a saída, a autorização da conta termina automaticamente; entrar de novo deixa de ser “dar uma olhada” e passa a ser acesso não autorizado."},{"topic":"Risco criminal comum","title":"Alguém já pediu seu cartão ou seu código de verificação emprestado?","desc":"Você emprestou cartão bancário, conta ou código de verificação a outra pessoa, ou ajudou alguém com “reconhecimento facial” para obter um empréstimo ou servir de testemunha.","opts":["Nunca; não empresto nada a ninguém","Recebi dinheiro para um amigo uma vez","Fiz reconhecimento facial como testemunha, não é um empréstimo, né?"],"rule":"Não empreste cartão, conta nem código de verificação a ninguém: o empréstimo em si já é ilegal; “não sabia” é presumido a partir de vantagens financeiras e movimentações anormais, e saber configura o crime de auxílio a crimes cibernéticos.","why":"No momento do reconhecimento facial ou da assinatura, o tomador do empréstimo é você; mesmo que o intermediário seja condenado, sua dívida não desaparece."},{"topic":"Amparo em caso de incidente","title":"Se você for realmente intimado, sabe qual é o primeiro passo?","desc":"Quando intimado ou detido, o que fazer no primeiro interrogatório e o que representa a janela de 37 dias.","opts":["Sei: pedir advogado no local, ler o termo palavra por palavra, e 37 dias é a janela para a ordem de prisão","Sei que preciso de advogado, mas não sei quando pedir","Não faço ideia; acho que basta cooperar"],"rule":"Intimado ou detido: peça advogado já no primeiro interrogatório, leia o termo palavra por palavra antes de assinar, não faça acordo privado, não apague registros e não admita coisas que não fez; a janela de 37 dias para a ordem de prisão, se perdida, não volta.","why":"Uma vez assinado, o termo é muito difícil de reverter; os 37 dias são a janela decisiva para evitar a ordem de prisão — perdê-la deixa você em desvantagem."},{"topic":"Regra de julgamento","title":"Quando você não consegue verificar um dado, como você escreve?","desc":"Ao escrever uma proposta ou um relatório, quando se depara com uma lei, um número ou um caso que não consegue verificar.","opts":["Escrevo explicitamente “não foi possível verificar”, sem inventar números","Procuro uma fonte parecida e completo com ela","Foi gerado por IA, deve estar mais ou menos certo"],"rule":"Se não há dados oficiais que possam ser verificados palavra por palavra, escreva explicitamente “não foi possível verificar”, sem inventar números nem casos; ao citar, confira o original palavra por palavra e valide com fontes cruzadas.","why":"Um único número inventado zera a credibilidade de todo o material — esse é o princípio de integridade probatória do livro inteiro."}]},"ar":{"ui":{"pageTitle":"الفحص القانوني لروّاد الأعمال · أهم 3 أشياء عليك القيام بها أولاً","brandName":"مسؤول تجنّب مخاطر الامتثال لروّاد الأعمال","brandSource":"من كتاب «دليل الحياة ذي القيمة العالية مقابل التكلفة»","brandMark":"ا","introH1":"تظن أنّ الأمور على ما يرام،<br>لكنك في الحقيقة <em>تتجاوز الخطوط الحمراء<\/em>.","introLede":"10 أسئلة تُجري <strong>فحصاً قانونياً<\/strong> على أفعالك الريادية.<br>وفي النهاية نخبرك بـ: <strong>أهم 3 أشياء عليك القيام بها الآن أولاً<\/strong>، ولماذا.","feat1":"<b>أفعال واقعية فقط<\/b> — كيف تُحصّل الأموال، وكيف تُستخرج التراخيص، وهل وُقّعت ضمانات؛ بلا مواعظ عامة.","feat2":"<b>مرتّبة حسب الخطورة<\/b> — عالج أولاً الأخطر، بدلاً من سرد قائمة من «عليك الانتباه إلى كل شيء».","feat3":"<b>لكل بند مصدره<\/b> — الإجابات من 44 بطاقة تجنّب مخاطر تم التحقق منها، مع الإشارة إلى القسم والمادة الأصليين.","startBtn":"ابدأ الفحص · حوالي دقيقتين","fineIntro":"يمكن حفظ النتيجة كصورة ومشاركتها · مجانية تماماً · لا نجمع أي معلومات","qCount":"السؤال <b>{n}<\/b> / 10","qBack":"← السؤال السابق","vLab":"نتيجة الفحص","secTitle":"أهم 3 أشياء عليك القيام بها الآن أولاً","shareTitle":"أنشئ بطاقة نتيجتك","shareDesc":"اضغط مطوّلاً على الصورة لحفظها في المعرض، ثم أرسلها إلى مجموعات وي تشات / دائرة الأصدقاء<br>ليخضع من يشاركك ريادة الأعمال للفحص أيضاً","genBtn":"أنشئ صورة للمشاركة","resultAlt":"بطاقة نتيجة الفحص، اضغط مطوّلاً للحفظ","saveTip":"↑ اضغط مطوّلاً على الصورة أعلاه ← احفظها في المعرض ← شاركها","restartBtn":"أعد الفحص مرة أخرى","fineResult":"من كتاب «دليل الحياة ذي القيمة العالية مقابل التكلفة» (CC BY 4.0) · تقطير عمودي · تاريخ المزامنة 2026-11-16<br>هذه الأداة فحص ذاتي عام، ولا تُغني عن حكم المحامي أو الطبيب أو المحاسب المتخصص؛ والمواد المتعلقة بالسياسات تخضع للنص الرسمي الساري.","cardHead":"فحص الامتثال لروّاد الأعمال","cardTitle":"أهم","cardTail":"أشياء عليك القيام بها أولاً","cardScore":"درجة الخطورة","cardRank":"الأولوية","cardSource":"المصدر","cardFooter1":"جميع بطاقات تجنّب المخاطر الـ44","cardFooter2":"امسح رمز الاستجابة السريعة لمتابعة «我AI您» · كل المحتوى متاح مجاناً","cardQr":"رمز QR","cardLicense":"من كتاب «دليل الحياة ذي القيمة العالية مقابل التكلفة» CC BY 4.0 · مُزامَن في 2026-11-16","toastSaved":"تم الإنشاء، اضغط مطوّلاً على الصورة للحفظ","note":"الصياغات القانونية تخضع للنص الصيني الأصلي."},"grades":["مخاطرة منخفضة","مخاطرة متوسطة","مخاطرة عالية"],"descs":["خط دفاعك الأساسي مكتمل. حافظ عليه، وانتبه إلى بنود التقوية التالية.","هناك بعض التراخي، وأحدها على الأقل قد يكلّفك كثيراً إن حدث. عالجها بالترتيب أدناه.","عدة خطوط حمراء مضاءة في آن واحد. لا تحاول إصلاح كل شيء دفعة واحدة؛ ابدأ بالأول في القائمة."],"qs":[{"topic":"امتثال المنصة","title":"إلى أي حساب تصل أموال المشتري أولاً؟","desc":"بعد أن يدفع المستخدم، تدخل الأموال أولاً إلى حساب المنصة نفسها، ثم تسحبها أنت أو تحوّلها إلى البائع.","opts":["تُسوّى الأموال مباشرة مع البائع، والمنصة تتقاضى رسوم خدمة فقط","تصل أولاً إلى حساب المنصة ثم أحوّلها أنا إلى البائع","أستلمها عبر وي تشات الشخصي أو بطاقتي البنكية"],"rule":"ألا تدخل الأموال إلى حساب المنصة نفسها: استخدم تقسيم الأموال عبر جهة مرخّصة، تُسوّى الأموال مباشرة مع البائع، والمنصة تتقاضى رسوم خدمة فقط.","why":"مرور الأموال بحساب المنصة ثم تحويلها خارجها قد يُعدّ ممارسة أعمال دفع بلا ترخيص (ما يُعرف بـ«التصفية الثانية»)."},{"topic":"امتثال المنصة","title":"قبل الإطلاق، هل تحققت من التراخيص المطلوبة؟","desc":"هل راجعتَ بنداً بنداً التراخيص والتسجيلات المطلوبة للموقع أو التطبيق أو البرنامج المصغّر قبل إطلاقه؟","opts":["صنّفتُ كل نشاط على حدة واستخرجتُ التراخيص والتسجيلات اللازمة","أطلق أولاً ثم نرى إن كان هناك من يتفقد","سألت المبرمج فقال إنه لا يلزم شيء"],"rule":"صنّف أولاً وفق «هل تُحصّل رسوماً + هل تسمح بانضمام جهات أخرى + ما نوع النشاط» ثم طابق التراخيص؛ وحتى إن كنتَ معفياً من الترخيص فعليك التسجيل، وتجاوز النطاق يُعاقَب كالعمل بلا ترخيص.","why":"الحصول على ترخيص ثم العمل خارج نطاقه يُعاقَب كالعمل بلا ترخيص؛ و«المبرمج قال إنه لا يلزم» ليس سنداً قانونياً."},{"topic":"أساسيات ريادة الأعمال","title":"هل وقّعتَ ضماناً شخصياً تضامنياً؟","desc":"هل وقّعتَ ضماناً شخصياً تضامنياً لقرض الشركة، أو رهنتَ منزل العائلة؟","opts":["لا، أصول العائلة منفصلة تماماً عن الشركة","وقّعتُ، والبنك قال إنها مجرد إجراء شكلي","وقّعتُ، لكن يفترض أنه ضمان عام، أليس كذلك؟"],"rule":"في كفالة الضمان انظر إلى كلمة «تضامني»: لا توقّع إن استطعتَ، وإن كان لا بد من التوقيع فوقّع كفالةً عامة فقط، بسقف واضح، وضمن المبلغ الذي تستطيع خسارته.","why":"التضامن يعني أنه عندما تعجز الشركة عن السداد، يُنفَّذ مباشرة على منزلك ومدخراتك."},{"topic":"أساسيات ريادة الأعمال","title":"هل دخلت أموال الشركة يوماً إلى بطاقتك الشخصية؟","desc":"تخلط بين الحساب الشخصي وحساب الشركة، أو تمرّر أحياناً ثمن البضاعة عبر البطاقة الشخصية، أو تكتب رأس المال مرتفعاً جداً.","opts":["لا، أفصل بين الحسابين بشكل صارم","استخدمتُ البطاقة الشخصية أحياناً لتسيير الأمور","أفعل ذلك دائماً، لأنه أسهل"],"rule":"اختيار الشكل القانوني المناسب مجرد مقدمة: افصل الحسابات، ولا تُدخل ثمن البضاعة إلى بطاقتك الشخصية، ولا تُبالغ في رأس المال؛ وإلا فقدتَ «المسؤولية المحدودة» مفعولها بسبب اختلاط الذمة أو تسريع أقساط رأس المال.","why":"ما إن تختلط الحسابات حتى يمكن لمحكمة التنفيذ أن تخرق جدار «المسؤولية المحدودة» مباشرة."},{"topic":"أساسيات ريادة الأعمال","title":"لو خسرتَ هذا المال كاملاً، كيف تتأثر حياتك؟","desc":"لو لم يتبقَّ من المال المستثمر شيء، هل سيتأثر تسديد الرهن العقاري أو تربية الأبناء أو العلاج الطبي؟","opts":["لو خسرتُ كل شيء لا تتأثر حياتي الأساسية","سيضيق الحال قليلاً، لكني سأتجاوزها","اقترضتُ مالاً، أو استخدمتُ مال أفراد الأسرة"],"rule":"حدّد أولاً المبلغ الذي لو خسرته كاملاً لا يؤثر على الرهن أو تربية الأبناء أو العلاج؛ ومال الأسرة والمال المقترض لا يُحسبان، وما زاد فلا تستثمره.","why":"المبلغ الذي تستطيع خسارته يجب حسابه سلفاً، لا أن تسأل نفسك بعد أن تكون قد خسرت نصفه."},{"topic":"الخطوط الحمراء للعاملين التقنيين","title":"قبل أن تقوم بذلك العمل الجانبي، ما الذي سألتَ عنه أولاً؟","desc":"في أعمال مثل جمع البيانات والسكربتات والغشّ وأدوات حجز التذاكر، ما كان أول سؤال في ذهنك قبل أن تبدأ؟","opts":["أسأل أولاً «هل ستُبلّغ الجهة المعنية؟» ثم أقرر","أنظر أولاً إلى إمكانية تنفيذها تقنياً","الجميع يفعلها، لا بأس على الأرجح"],"rule":"قبل أن تبدأ، لا تسأل «هل يمكن تنفيذها تقنياً؟» بل اسأل «هل سيُبلّغ الصانع أو المنصة أو الشركة؟» — سجلات النظام قابلة للاستدعاء، و«لا أحد يتابع» وهم.","why":"الإمكان التقني لا يعني الإذن القانوني؛ سجلات الخلفية محفوظة ويمكن استدعاؤها كاملة لاحقاً."},{"topic":"الخطوط الحمراء للعاملين التقنيين","title":"هل ما زالت أشياء شركتك السابقة بحوزتك؟","desc":"شفرة المصدر وقائمة العملاء وحسابات النظام: احتفظتَ بها بعد المغادرة، بل وربما تدخل لتتصفحها بين حين وآخر.","opts":["سلّمتُ كل شيء وأُلغيت الصلاحيات","احتفظتُ ببعض المواد كمرجع","ما زلتُ أحتفظ بالحساب وأدخل أحياناً"],"rule":"عند المغادرة سلّم كل شيء وألغِ الصلاحيات: لا تحذف قواعد بيانات، ولا تترك أبواباً خلفية، ولا تأخذ شفرة المصدر؛ تنتهي صلاحية الحساب بالمغادرة، ويُحال الأجر المتأخر إلى التحكيم، والشفرة وقائمة العملاء ملك للشركة.","why":"بعد المغادرة تنتهي صلاحية الحساب تلقائياً، فيصبح دخولك مجدداً ليس «تصفّحاً» بل وصولاً غير مصرّح به."},{"topic":"المخاطر الجنائية للأفراد","title":"هل سبق أن استعار أحدٌ منك بطاقتك أو رمز التحقق؟","desc":"أعرتَ بطاقتك البنكية أو حسابك أو رمز التحقق لشخص آخر، أو ساعدتَه بـ«التعرّف على الوجه» للحصول على قرض أو ليكون شاهداً.","opts":["أبداً، لا أُعير أي شيء لأحد","استلمتُ مالاً لصديق مرة واحدة","عملتُ تعرّف وجه كشاهد، ليس قرضاً أليس كذلك؟"],"rule":"لا تُعر بطاقتك أو حسابك أو رمز التحقق لأحد: الإعارة نفسها غير قانونية، ويُفترض «عدم العلم» من المكاسب المالية والتدفقات غير الطبيعية، أما العلم فيُكوّن جريمة مساعدة الجرائم السيبرانية.","why":"لحظة التعرّف على الوجه أو التوقيع، يكون المقترض هو أنت؛ وحتى لو حُكم على الوسيط، لا يُعفى ذلك دينك."},{"topic":"سبل المعالجة عند وقوع حادث","title":"إن استُدعيتَ فعلاً، هل تعرف الخطوة الأولى؟","desc":"عند الاستدعاء أو التوقيف، ما الذي يجب فعله في أول استجواب، وماذا تمثل نافذة الـ37 يوماً؟","opts":["واضح: أطلب محامياً فوراً، وأقرأ المحضر كلمة بكلمة، و37 يوماً هي نافذة أمر الاعتقال","أعرف أنني أحتاج محامياً، لكن لا أعرف متى أطلبه","لا أعرف شيئاً، أظن يكفي أن أتعاون"],"rule":"عند الاستدعاء أو التوقيف: اطلب محامياً في أول استجواب، واقرأ المحضر كلمة بكلمة قبل التوقيع، ولا تُسوِّل أمراً جانبياً، ولا تحذف سجلاً، ولا تعترف بأمور لم تفعلها؛ ونافذة الـ37 يوماً لأمر الاعتقال إن فُوّتت لا تعود.","why":"بمجرد التوقيع يصعب جداً دحض المحضر؛ و37 يوماً هي النافذة الحاسمة لتجنّب أمر الاعتقال، وتفويتها يضعك في موقف ضعيف."},{"topic":"قاعدة الحكم","title":"عندما لا تجد بيانات يمكن التحقق منها، كيف تكتبها؟","desc":"عند كتابة مقترح أو تقرير، وتصادفك مادة قانونية أو رقم أو حالة لا تستطيع التحقق منها.","opts":["أكتب صراحةً «تعذّر التحقق»، دون اختلاق أرقام","أجد مصدراً مشابهاً وأُكمل به","مُولَّد بالذكاء الاصطناعي، لا بأس على الأرجح"],"rule":"إن لم تكن هناك بيانات رسمية قابلة للتحقق كلمة بكلمة، فاكتب صراحةً «تعذّر التحقق»، ولا تختلق أرقاماً ولا حالات؛ وعند الاقتباس طابق النص الأصلي كلمة بكلمة وتحقق من مصادر متقاطعة.","why":"رقم واحد مختلق يُفقد كل المادة مصداقيتها — هذا هو الحد الأدنى من أمانة الدليل في الكتاب بأكمله."}]},"hi":{"ui":{"pageTitle":"उद्यमी अनुपालन जांच · आपको सबसे पहले करने चाहिए वे 3 काम","brandName":"उद्यमी अनुपालन जोखिम-निवारण अधिकारी","brandSource":"«मूल्य-प्रभावी जीवन मार्गदर्शिका» से उद्धृत","brandMark":"अ","introH1":"आपको लगता है सब ठीक है,<br>पर आप वास्तव में <em>लाल रेखा पार कर रहे हैं<\/em>।","introLede":"10 सवाल, आपके उद्यमी कदमों की एक <strong>अनुपालन जांच<\/strong> करते हैं।<br>जवाब देने के बाद बताएँगे: <strong>अभी सबसे पहले करने चाहिए वे 3 काम<\/strong>, और क्यों।","feat1":"<b>सिर्फ असली कदम<\/b> — पैसा कैसे मिलता है, लाइसेंस कैसे बनते हैं, गारंटी पर हस्ताक्षर हुए या नहीं; बड़ी-बड़ी बातें नहीं।","feat2":"<b>जोखिम के अनुसार क्रम<\/b> — पहले सबसे घातक वाली बात संभालें, न कि “सब बातों पर ध्यान दें” की सूची बनाएँ।","feat3":"<b>हर बात का स्रोत<\/b> — जवाब 44 जाँच-चूक कार्डों से आते हैं जिन्हें जाँचा जा चुका है, मूल अनुच्छेद और धारा भी दी गई है।","startBtn":"जांच शुरू करें · लगभग 2 मिनट","fineIntro":"नतीजे को इमेज के रूप में सहेजकर शेयर किया जा सकता है · पूरी तरह निःशुल्क · कोई जानकारी एकत्र नहीं की जाती","qCount":"प्रश्न <b>{n}<\/b> / 10","qBack":"← पिछला प्रश्न","vLab":"जांच परिणाम","secTitle":"आपको अभी सबसे पहले करने चाहिए वे 3 काम","shareTitle":"अपना जांच परिणाम कार्ड बनाएँ","sh
